<!doctype html>
<html lang="de">
<head>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/app-layout.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HoS · VU 1d – LZK-Training: Unsere Erde & Die Schöpfung</title>
  <style>
    .hos-stage { grid-template-columns: minmax(0, 1fr) 290px; }
    .qpanel { display: flex; flex-direction: column; gap: 10px; overflow: auto; padding: 16px 22px; }
    .qhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .qlabel { color: var(--subject-strong); font-size: .78rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .qcount { color: var(--hos-muted); font-weight: 700; font-size: .9rem; }
    .qprompt { font-size: clamp(1.3rem, 2.1vw, 1.7rem); font-weight: 800; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
    .qprompt i { font-weight: 700; }
    .qarea { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
    .opts.short { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .opt { text-align: left; border: 2px solid var(--hos-line); background: #fff; color: var(--hos-ink); border-radius: 14px; padding: 13px 16px; font-weight: 700; cursor: pointer; font-size: 1.05rem; transition: transform 120ms ease, border-color 120ms ease, background 120ms ease; }
    .opt:hover { transform: translateY(-1px); border-color: var(--subject-line); background: var(--subject-soft); }
    .opt.sel { border-color: var(--subject); background: var(--subject-soft); }
    .opt.right { border-color: var(--hos-good); background: var(--hos-good-soft); color: var(--hos-good); }
    .opt.wrong { border-color: var(--hos-bad); background: var(--hos-bad-soft); color: var(--hos-bad); }
    .statement { font-size: clamp(1.15rem, 1.8vw, 1.4rem); font-weight: 700; background: #f8fafc; border: 1px solid var(--hos-line); padding: 16px 18px; border-radius: 14px; }
    .txt { font-size: 1.05rem; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--hos-line); width: min(420px, 100%); }
    .txt.right { border-color: var(--hos-good); background: var(--hos-good-soft); } .txt.wrong { border-color: var(--hos-bad); background: var(--hos-bad-soft); }
    /* Reihenfolge */
    .ord-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ord-col h4 { margin: 0 0 4px; font-size: .85rem; color: var(--hos-muted); }
    .ord-list { display: flex; flex-direction: column; gap: 6px; min-height: 56px; border: 2px dashed var(--hos-line); border-radius: 12px; padding: 5px; }
    .chip { border: 2px solid var(--hos-line); background: #fff; border-radius: 12px; padding: 6px 12px; font-weight: 700; cursor: pointer; text-align: left; font-size: .95rem; }
    .chip:hover { border-color: var(--subject-line); }
    .chip .n { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--subject); color: #fff; font-size: .8rem; margin-right: 6px; }
    .chip.right { border-color: var(--hos-good); background: var(--hos-good-soft); } .chip.wrong { border-color: var(--hos-bad); background: var(--hos-bad-soft); }
    /* Zuordnen / Sortieren */
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(220px, 1.4fr); gap: 10px; align-items: center; border: 1px solid var(--hos-line); border-radius: 12px; padding: 4px 10px; background: #fff; }
    .row.right { background: var(--hos-good-soft); border-color: var(--hos-good-line); } .row.wrong { background: var(--hos-bad-soft); border-color: var(--hos-bad-line); }
    .row select { width: 100%; font-size: .95rem; }
    .row .lab { font-weight: 700; }
    .row .sol { font-size: .85rem; color: var(--hos-bad); font-weight: 700; }
    .catbtns { display: flex; flex-wrap: wrap; gap: 4px; }
    .catbtns button { border: 1px solid var(--hos-line); background: #fafaf9; border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: .85rem; cursor: pointer; }
    .catbtns button.sel { background: var(--subject); border-color: var(--subject); color: #fff; }
    /* Karten und Skizzen */
    .fig { display: flex; justify-content: center; align-items: flex-start; min-height: 0; }
    .fig svg { width: 100%; max-width: 760px; height: auto; max-height: 100%; user-select: none; }
    svg .land { stroke: #475569; stroke-width: .6; }
    svg .clickable { cursor: pointer; }
    svg .clickable:hover { filter: brightness(.93); }
    svg text { font-family: system-ui, sans-serif; }
    .mark { pointer-events: none; }
    /* Seitenleiste */
    .side { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
    .partlist { display: flex; flex-direction: column; gap: 6px; }
    .pl { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: .88rem; font-weight: 700; }
    .pl .hos-progress { grid-column: 1 / -1; min-width: 0; }
    .pl.cur { color: var(--subject-strong); }
    .merke ul { margin: 4px 0 0; padding-left: 18px; font-size: .86rem; line-height: 1.35; }
    .merke li { margin-bottom: 3px; }
    .hoshint { display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--hos-muted); }
    .hoshint img { width: 54px; height: auto; }
    .deco { width: 100%; border-radius: 10px; display: block; }
    /* Ergebnis */
    .result { display: flex; flex-direction: column; gap: 10px; }
    .bigscore { font-size: 2rem; font-weight: 900; color: var(--subject-strong); }
    .reslist { border: 1px solid var(--hos-line); border-radius: 12px; padding: 6px 10px; max-height: 260px; overflow: auto; font-size: .92rem; }
    .reslist div { padding: 4px 0; border-bottom: 1px solid #f0efed; }
    .reslist div:last-child { border: 0; }
    .reslist b { color: var(--hos-good); }
    .qpanel.start { justify-content: center; }
    .hero { display: grid; grid-template-columns: 1.35fr .65fr; gap: 28px; align-items: center; max-width: 1120px; margin: 0 auto; width: 100%; }
    .hero-main { display: flex; flex-direction: column; gap: 12px; }
    .over { align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--subject-soft); color: var(--subject-strong); font-size: 12.5px; font-weight: 800; letter-spacing: .02em; }
    .hero h2 { margin: 0; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -.02em; }
    .hero p { margin: 0; color: var(--hos-muted); line-height: 1.5; }
    .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
    .lvl { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--hos-line); background: #fff; font: inherit; font-weight: 800; color: var(--hos-ink); cursor: pointer; transition: transform 120ms ease, border-color 120ms ease; }
    .lvl:hover { transform: translateY(-1px); border-color: var(--subject); }
    .lvl small { display: block; color: var(--hos-muted); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
    .lvl em { font-style: normal; font-size: .8rem; color: var(--subject-strong); background: var(--subject-soft); border-radius: 999px; padding: 2px 8px; }
    .rules { position: relative; background: #f8fafc; border: 1px solid var(--hos-line); border-radius: 16px; padding: 14px 16px 70px; font-size: .9rem; line-height: 1.45; }
    .rules > b { color: var(--subject-strong); }
    .rules ul { margin: 6px 0 0; padding-left: 18px; }
    .rules li { margin-bottom: 3px; }
    .rules img { position: absolute; right: 14px; bottom: 8px; width: 56px; }
    .rules ul { padding-right: 0; }
    .hos-stage.full { grid-template-columns: 1fr; }
    .hos-stage.full .side { display: none; }
    .badge-vu { background: var(--subject) !important; }
    .tag { font-size: .78rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--subject-soft); color: var(--subject-strong); border: 1px solid var(--subject-line); }
  </style>
</head>
<body class="hos-app subject-andere">

<header class="app-header">
  <div class="brand-row">
    <img src="/chatisthisreal.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
    <div class="brand-title">
      <div class="badge-main badge-vu">VU</div>
      <h1>LZK-Training 1d</h1>
    </div>
  </div>
  <div class="header-actions">

<main class="hos-main">
  <div class="hos-topbar">
    <div class="hos-seg" id="themeSeg">

    <span class="hos-spacer"></span>
    <span class="hos-pill" id="modePill"></span>

    <aside class="hos-panel side" id="side"></aside>
  </div>

  <div class="hos-bottombar">
    <div class="hos-feedback" id="feedback">Wähle oben ein Thema und einen Teil.</div>
    <button type="button" class="hos-btn soft" id="tipBtn">Tipp</button>
    <button type="button" class="hos-btn primary" id="mainBtn">Prüfen</button>
  </div>
</main>

  // =====================================================================================
  // Aufgaben darstellen und prüfen
  // =====================================================================================
  let cur = null;            // aktuelle Aufgabe (Instanz)
  let answered = false;
  const qa = () => $('qarea');

  function instance(q) {
    // erzeugt eine konkrete Aufgabe (zufällige Teile, gemischte Antworten)
    const it = { q, max: 1, sol: '', user: null };
    if (q.type === 'mc') it.opts = shuffle(q.opts);
    if (q.type === 'mapname') it.opts = shuffle([q.target].concat(shuffle(CONTS.filter(c => c !== q.target)).slice(0, 3)));
    if (q.type === 'swatch') it.opts = shuffle([q.a].concat(shuffle(['Tiefland', 'Hügelland', 'Bergland', 'Hochgebirge', 'Gletscher', 'Meer'].filter(x => x !== q.a)).slice(0, 3)));
    if (q.type === 'order') { it.max = 2; let s; do { s = shuffle(q.items); } while (s.join() === q.items.join()); it.pool = s; it.seq = []; }
    if (q.type === 'match') { it.max = 2; it.rows = shuffle(q.pairs); it.rights = shuffle([...new Set(q.pairs.map(p => p[1]))]); }
    if (q.type === 'sort') {
      it.max = 2;
      if (q.gen === 'era') it.items = shuffle(ERA.map((e, k) => pick(ERAFACTS.filter(f => f[1] === k))).map(f => [f[0], ERA[f[1]]]).concat([pick(ERAFACTS)].map(f => [f[0], ERA[f[1]]]))).filter((x, i, a) => a.findIndex(y => y[0] === x[0]) === i);
      else if (q.gen === 'quelle') { const c = ['Sach', 'Schrift', 'Bild', 'mündlich']; it.items = shuffle(c.map((n, k) => { const f = pick(QEX.filter(x => x[1] === k)); return [f[0], n]; })); }
      else it.items = shuffle(q.items);
    }
    if (q.type === 'coord' || q.type === 'coordclick') {
      const lats = [60, 30, -30, -60], lons = [-150, -120, -90, -60, -30, 30, 60, 90, 120, 150];
      const mk = () => ({ lat: pick(lats), lon: pick(lons) });
      let p; do { p = mk(); } while (Math.abs(p.lat) === Math.abs(p.lon));
      it.p = p;
      const fmt = (la, lo) => Math.abs(la) + '° ' + (la > 0 ? 'N' : 'S') + ' / ' + Math.abs(lo) + '° ' + (lo > 0 ? 'O' : 'W');
      it.correct = fmt(p.lat, p.lon);
      if (q.type === 'coord') {
        const d = [fmt(-p.lat, p.lon), fmt(p.lat, -p.lon)];
        if (Math.abs(p.lon) <= 90) d.push(fmt(Math.sign(p.lat) * Math.abs(p.lon), Math.sign(p.lon) * Math.abs(p.lat))); else d.push(fmt(-p.lat, -p.lon));
        it.opts = shuffle([it.correct].concat(d));
      } else {
        const pts = [p]; let guard = 0;
        while (pts.length < 4 && guard++ < 200) { const x = mk(); if (!pts.some(y => y.lat === x.lat && y.lon === x.lon)) pts.push(x); }
        it.pts = shuffle(pts).map((x, i) => Object.assign({ label: 'ABCD'[i] }, x));
        it.answerLabel = it.pts.find(x => x.lat === p.lat && x.lon === p.lon).label;
      }
    }
    if (q.type === 'gridfind' || q.type === 'gridclick') {
      const fields = shuffle(COLS.split('').flatMap(c => [1, 2, 3, 4].map(r => c + r)));
      const syms = shuffle(SYMS).slice(0, 4);
      it.items = syms.map((s, i) => ({ sym: s[0], name: s[1], f: fields[i] }));
      it.target = it.items[0];
      if (q.type === 'gridclick') it.field = fields[5];
      if (q.type === 'gridfind') it.opts = shuffle([it.target.f, it.target.f[0] + (((+it.target.f[1]) % 4) + 1), COLS[(COLS.indexOf(it.target.f[0]) + 2) % 6] + it.target.f[1], it.target.f[1] + it.target.f[0]]);
    }
    if (q.type === 'layers') {
      it.finds = shuffle(FINDS).slice(0, 4);
      it.ask = pick(['alt', 'jung']);
      it.answer = it.ask === 'alt' ? 3 : 0;
    }
    return it;
  }

  function optButtons(opts) {
    return '<div class="opts' + (opts.every(o => String(o).length <= 22) ? ' short' : '') + '">' + opts.map((o, i) => '<button type="button" class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
  }
  function bindOpts(it) {
    qa().querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (answered) return;
      qa().querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); it.user = it.opts[+b.dataset.i];
      if (state.mode === 'test') updateMain();
      else check();
    }));
  }

  function render(it) {
    cur = it; answered = false;
    const q = it.q;
    let prompt = q.q || '', html = '';
    switch (q.type) {
      case 'mc': html = optButtons(it.opts); break;
      case 'tf': prompt = 'Stimmt das?'; it.opts = ['stimmt', 'stimmt nicht']; html = '<div class="statement">' + q.s + '</div>' + optButtons(it.opts); break;
      case 'input': html = '<input class="txt" id="txtIn" type="text" autocomplete="off" placeholder="Antwort eingeben …"><div class="hos-muted" style="font-size:.85rem">Mit Enter bestätigen.</div>'; break;
      case 'mapclick': html = '<div class="fig">' + mapSVG({ colors: q.kind === 'cont', clickLand: true, clickWater: true }) + '</div>'; break;
      case 'mapname': html = '<div class="fig" style="max-height:290px">' + mapSVG({ highlight: q.target }) + '</div>' + optButtons(it.opts.map(c => CNAME[c] || c)); it.opts = it.opts.map(c => CNAME[c] || c); break;
      case 'coord': html = '<div class="fig" style="max-height:300px">' + mapSVG({ grid: true, gridLabels: true, points: [Object.assign({ label: '' }, it.p)] }) + '</div>' + optButtons(it.opts); break;
      case 'coordclick': prompt = q.q + ' <b>' + it.correct + '</b>'; html = '<div class="fig">' + mapSVG({ grid: true, gridLabels: true, points: it.pts, clickPoints: true }) + '</div>'; break;
      case 'lineclick': html = '<div class="fig">' + mapSVG({ grid: true, clickLand: true, clickWater: true }) + '</div><div class="hos-muted" style="font-size:.85rem">Die gestrichelten Linien sind Breiten- und Längenkreise.</div>'; break;
      case 'hemi': html = '<div class="fig">' + mapSVG({ grid: true, strong: true, gridLabels: true, clickLand: true, clickWater: true }) + '</div>'; break;
      case 'rose': html = '<div class="fig">' + roseSVG(false) + '</div>'; break;
      case 'gridfind': prompt = 'In welchem Feld liegt <b>' + it.target.name + '</b>?'; html = '<div class="fig">' + gridSVG(it.items) + '</div>' + optButtons(it.opts); break;
      case 'gridclick': prompt = q.q + ' <b>' + it.field + '</b>'; html = '<div class="fig">' + gridSVG(it.items) + '</div>'; break;
      case 'swatch': html = '<div style="display:flex;gap:14px;align-items:center"><div style="width:120px;height:70px;border-radius:12px;border:2px solid #94a3b8;background:' + q.col + '"></div></div>' + optButtons(it.opts); break;
      case 'layers': prompt = 'Archäologen haben in vier Erdschichten gegraben. Klicke auf die Schicht mit dem <b>' + (it.ask === 'alt' ? 'ältesten' : 'jüngsten') + '</b> Fund.'; html = '<div class="fig">' + layersSVG(it.finds) + '</div>'; break;
      case 'order':
        html = '<div class="ord-wrap"><div class="ord-col"><h4>Tippe der Reihe nach an:</h4><div class="ord-list" id="ordPool"></div></div><div class="ord-col"><h4>Deine Reihenfolge (zum Zurücklegen antippen):</h4><div class="ord-list" id="ordSeq"></div></div></div>';
        break;
      case 'match':
        html = '<div class="rows">' + it.rows.map((p, i) => '<div class="row" data-i="' + i + '"><span class="lab">' + esc(p[0]) + '</span><select data-i="' + i + '"><option value="">– wählen –</option>' + it.rights.map(r => '<option>' + esc(r) + '</option>').join('') + '</select></div>').join('') + '</div>';
        break;
      case 'sort':
        html = '<div class="rows">' + it.items.map((p, i) => '<div class="row" data-i="' + i + '"><span class="lab">' + esc(p[0]) + '</span><div class="catbtns">' + q.cats.map(c => '<button type="button" data-i="' + i + '" data-c="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div></div>').join('') + '</div>';
        it.user = it.items.map(() => null);
        break;
    }
    $('qprompt').innerHTML = prompt;
    qa().innerHTML = html;
    // Interaktion
    if (q.type === 'input') { const t = $('txtIn'); t.focus(); t.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); mainAction(); } }); t.addEventListener('input', () => { it.user = t.value; updateMain(); }); }
    if (['mc', 'tf', 'mapname', 'coord', 'swatch', 'gridfind'].includes(q.type)) bindOpts(it);
    const svg = qa().querySelector('svg');
    if (q.type === 'mapclick' || q.type === 'lineclick' || q.type === 'hemi') {
      svg.addEventListener('click', ev => {
        if (answered) return;
        const p = svgPoint(svg, ev); const lon = p.x / 2 - 180, lat = 84 - p.y / 2;
        const land = ev.target.dataset && ev.target.dataset.c;
        it.user = { x: p.x, y: p.y, lon, lat, land };
        dropMark(svg, p.x, p.y, null);
        if (state.mode === 'test') { svg.querySelector('#marks circle').setAttribute('fill', '#334155'); updateMain(); } else check();
      });
    }
    if (q.type === 'coordclick') svg.querySelectorAll('[data-p]').forEach(g => g.addEventListener('click', () => { if (answered) return; it.user = g.dataset.p; svg.querySelectorAll('[data-p] circle').forEach(c => c.setAttribute('fill', '#dc2626')); g.querySelector('circle').setAttribute('fill', '#334155'); if (state.mode === 'test') updateMain(); else check(); }));
    if (q.type === 'rose') svg.querySelectorAll('[data-d]').forEach(a => a.addEventListener('click', () => { if (answered) return; it.user = a.dataset.d; svg.querySelectorAll('[data-d]').forEach(x => x.style.opacity = ''); a.style.opacity = .55; if (state.mode === 'test') updateMain(); else check(); }));
    if (q.type === 'gridclick') svg.querySelectorAll('[data-f]').forEach(r => r.addEventListener('click', () => { if (answered) return; it.user = r.dataset.f; svg.querySelectorAll('[data-f]').forEach(x => x.style.stroke = ''); r.style.stroke = '#334155'; r.style.strokeWidth = 4; if (state.mode === 'test') updateMain(); else check(); }));
    if (q.type === 'layers') svg.querySelectorAll('[data-l]').forEach(r => r.addEventListener('click', () => { if (answered) return; it.user = +r.dataset.l; svg.querySelectorAll('[data-l]').forEach(x => x.style.opacity = ''); r.style.opacity = .7; if (state.mode === 'test') updateMain(); else check(); }));
    if (q.type === 'order') {
      const draw = () => {
        $('ordPool').innerHTML = it.pool.map((t, i) => '<button type="button" class="chip" data-i="' + i + '">' + esc(t) + '</button>').join('');
        $('ordSeq').innerHTML = it.seq.map((t, i) => '<button type="button" class="chip" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' + esc(t) + '</button>').join('');
        $('ordPool').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { if (answered) return; it.seq.push(it.pool.splice(+b.dataset.i, 1)[0]); draw(); updateMain(); }));
        $('ordSeq').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { if (answered) return; it.pool.push(it.seq.splice(+b.dataset.i, 1)[0]); draw(); updateMain(); }));
      };
      it.draw = draw; draw();
    }
    if (q.type === 'match') qa().querySelectorAll('select').forEach(s => s.addEventListener('change', updateMain));
    if (q.type === 'sort') qa().querySelectorAll('.catbtns button').forEach(b => b.addEventListener('click', () => {
      if (answered) return;
      const i = +b.dataset.i; it.user[i] = b.dataset.c;
      b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); updateMain();
    }));
    setFeedback('', state.mode === 'test' ? 'Probetest – die Auflösung gibt es am Ende.' : 'Los geht\'s!');
    updateMain();
  }

  // Ist eine Antwort gegeben?
  function hasAnswer(it) {
    const t = it.q.type;
    if (t === 'order') return it.pool.length === 0;
    if (t === 'match') return [...qa().querySelectorAll('select')].every(s => s.value);
    if (t === 'sort') return it.user.every(Boolean);
    if (t === 'input') return !!(it.user && it.user.trim());
    return it.user !== null && it.user !== undefined;
  }

  // Bewertung: gibt { pts, ok, sol } zurück
  function grade(it) {
    const q = it.q;
    let ok = false, pts = 0, sol = '';
    switch (q.type) {
      case 'mc': case 'swatch': ok = it.user === q.a; sol = q.a; break;
      case 'tf': ok = (it.user === 'stimmt') === q.a; sol = q.a ? 'stimmt' : 'stimmt nicht'; break;
      case 'mapname': ok = it.user === (CNAME[q.target] || q.target); sol = CNAME[q.target] || q.target; break;
      case 'input': ok = q.a.some(a => norm(a) === norm(it.user || '')); sol = q.a[0]; break;
      case 'coord': ok = it.user === it.correct; sol = it.correct; break;
      case 'coordclick': ok = it.user === it.answerLabel; sol = 'Punkt ' + it.answerLabel + ' (' + it.correct + ')'; break;
      case 'mapclick': {
        const u = it.user || {};
        if (q.kind === 'cont') { ok = u.land === q.target; it.hit = u.land || ('Wasser: ' + oceanAt(u.lon, u.lat)); }
        else { const o = u.land ? null : oceanAt(u.lon, u.lat); ok = o === q.target; it.hit = u.land || o; }
        sol = q.kind === 'cont' ? (CNAME[q.target] || q.target) : (ONAME[q.target] || q.target);
        break;
      }
      case 'lineclick': { const u = it.user || {}; ok = q.target === 'aeq' ? Math.abs(u.y - py(0)) <= 9 : Math.abs(u.x - px(0)) <= 9; sol = q.target === 'aeq' ? 'die Linie bei 0° Breite (waagrecht in der Mitte)' : 'die Linie bei 0° Länge (senkrecht, durch Greenwich/London)'; break; }
      case 'hemi': { const u = it.user || {}; ok = (q.ns === 'N' ? u.lat > 1 : u.lat < -1) && (q.ow === 'O' ? u.lon > 1 : u.lon < -1); sol = (q.ns === 'N' ? 'oberhalb' : 'unterhalb') + ' des Äquators und ' + (q.ow === 'O' ? 'rechts' : 'links') + ' vom Nullmeridian'; break; }
      case 'rose': ok = it.user === q.target; sol = DIRS.find(d => d[0] === q.target)[1] + ' (' + q.target + ')'; break;
      case 'gridfind': ok = it.user === it.target.f; sol = 'Feld ' + it.target.f; break;
      case 'gridclick': ok = it.user === it.field; sol = 'Feld ' + it.field + ' (Buchstabe = Spalte, Zahl = Zeile)'; break;
      case 'layers': ok = it.user === it.answer; sol = (it.ask === 'alt' ? 'die unterste Schicht (' + it.finds[3][1] + ')' : 'die oberste Schicht (' + it.finds[0][1] + ')') + ' – je tiefer, desto älter'; break;
      case 'order': {
        const right = it.seq.filter((t, i) => t === q.items[i]).length;
        ok = right === q.items.length; pts = ok ? 2 : right >= Math.ceil(q.items.length / 2) ? 1 : 0;
        sol = q.items.map((t, i) => (i + 1) + '. ' + t).join(' · ');
        return { ok, pts, sol, right, total: q.items.length };
      }
      case 'match': {
        const sel = [...qa().querySelectorAll('select')];
        const right = sel.filter((s, i) => s.value === it.rows[i][1]).length;
        ok = right === it.rows.length; pts = ok ? 2 : right >= Math.ceil(it.rows.length / 2) ? 1 : 0;
        sol = it.rows.map(p => p[0] + ' → ' + p[1]).join(' · ');
        return { ok, pts, sol, right, total: it.rows.length };
      }
      case 'sort': {
        const right = it.items.filter((p, i) => it.user[i] === p[1]).length;
        ok = right === it.items.length; pts = ok ? 2 : right >= Math.ceil(it.items.length / 2) ? 1 : 0;
        sol = it.items.map(p => p[0] + ' → ' + p[1]).join(' · ');
        return { ok, pts, sol, right, total: it.items.length };
      }
    }
    return { ok, pts: ok ? 1 : 0, sol };
  }

  // Lösung anzeigen (Übungsmodus)
  function showSolution(it, g) {
    const q = it.q;
    if (['mc', 'tf', 'mapname', 'coord', 'swatch', 'gridfind'].includes(q.type)) {
      qa().querySelectorAll('.opt').forEach(b => { const o = it.opts[+b.dataset.i]; if (o === g.sol) b.classList.add('right'); else if (o === it.user) b.classList.add('wrong'); });
    }
    if (q.type === 'input') $('txtIn').classList.add(g.ok ? 'right' : 'wrong');
    const svg = qa().querySelector('svg');
    if (q.type === 'mapclick') {
      dropMark(svg, it.user.x, it.user.y, g.ok);
      if (!g.ok && q.kind === 'cont') svg.querySelectorAll('[data-c="' + q.target + '"]').forEach(p => { p.setAttribute('stroke', '#16a34a'); p.setAttribute('stroke-width', '3'); });
      if (!g.ok && q.kind === 'ocean') {
        const C = { 'Pazifischer Ozean': [-140, 0], 'Atlantischer Ozean': [-35, 20], 'Indischer Ozean': [78, -25], 'Arktischer Ozean': [-10, 78], 'Südlicher Ozean': [30, -63] }[q.target];
        svg.querySelector('#marks').innerHTML += '<circle class="mark" cx="' + px(C[0]) + '" cy="' + py(C[1]) + '" r="16" fill="none" stroke="#16a34a" stroke-width="4"/>';
      }
    }
    if (q.type === 'lineclick' || q.type === 'hemi') {
      dropMark(svg, it.user.x, it.user.y, g.ok);
      if (!g.ok) svg.querySelector('#marks').innerHTML += q.type === 'lineclick' ? (q.target === 'aeq' ? '<line class="mark" x1="0" y1="' + py(0) + '" x2="' + MW + '" y2="' + py(0) + '" stroke="#16a34a" stroke-width="4"/>' : '<line class="mark" x1="' + px(0) + '" y1="0" x2="' + px(0) + '" y2="' + MH + '" stroke="#16a34a" stroke-width="4"/>')
        : '<rect class="mark" x="' + (q.ow === 'O' ? px(0) : 0) + '" y="' + (q.ns === 'N' ? 0 : py(0)) + '" width="' + (MW / 2) + '" height="' + (py(0) - (q.ns === 'N' ? 0 : 0)) + '" fill="#16a34a" opacity=".18"/>';
    }
    if (q.type === 'coordclick') svg.querySelectorAll('[data-p]').forEach(gp => { if (gp.dataset.p === it.answerLabel) gp.querySelector('circle').setAttribute('fill', '#16a34a'); });
    if (q.type === 'rose') { svg.querySelectorAll('[data-d]').forEach(a => { if (a.dataset.d === q.target) a.setAttribute('fill', '#16a34a'); else if (a.dataset.d === it.user) a.setAttribute('fill', '#dc2626'); }); }
    if (q.type === 'gridclick' || q.type === 'gridfind') svg.querySelectorAll('[data-f]').forEach(r => { if (r.dataset.f === (q.type === 'gridclick' ? it.field : it.target.f)) r.setAttribute('fill', '#bbf7d0'); else if (r.dataset.f === it.user) r.setAttribute('fill', '#fecaca'); });
    if (q.type === 'layers') svg.querySelectorAll('[data-l]').forEach(r => { if (+r.dataset.l === it.answer) { r.setAttribute('stroke', '#16a34a'); r.setAttribute('stroke-width', '5'); } });
    if (q.type === 'order') {
      $('ordSeq').querySelectorAll('.chip').forEach((b, i) => b.classList.add(it.seq[i] === q.items[i] ? 'right' : 'wrong'));
    }
    if (q.type === 'match') qa().querySelectorAll('.row').forEach((r, i) => { const s = r.querySelector('select'); const ok = s.value === it.rows[i][1]; r.classList.add(ok ? 'right' : 'wrong'); s.disabled = true; if (!ok) r.insertAdjacentHTML('beforeend', '<span></span><span class="sol">richtig: ' + esc(it.rows[i][1]) + '</span>'); });
    if (q.type === 'sort') qa().querySelectorAll('.row').forEach((r, i) => { const ok = it.user[i] === it.items[i][1]; r.classList.add(ok ? 'right' : 'wrong'); if (!ok) r.insertAdjacentHTML('beforeend', '<span></span><span class="sol">richtig: ' + esc(it.items[i][1]) + '</span>'); });
  }

  // =====================================================================================
  // Ablauf: Üben (adaptiv) und Probetest
  // =====================================================================================
  const state = { theme: 'erde', part: null, mode: 'start', queue: [], test: null };
  let mastered = R.load('mastered', {});   // id → true
  let tries = R.load('tries', {});         // id → Anzahl falsch

  function partItems(p) { return BANK.filter(q => q.part === p); }
  function partProgress(p) { const a = partItems(p); return { done: a.filter(q => mastered[q.id]).length, total: a.length }; }

  function startPractice(p) {
    state.part = p; state.mode = 'ueben';
    state.theme = p[0] === 'e' ? 'erde' : 'schoepfung';
    const items = partItems(p);
    // Noch nicht Gekonntes zuerst, häufig Falsches öfter
    const open = shuffle(items.filter(q => !mastered[q.id]));
    const rest = shuffle(items.filter(q => mastered[q.id]));
    state.queue = open.concat(rest);
    state.count = 0;
    buildChrome();
    next();
  }
  function next() {
    if (state.mode === 'ueben') {
      if (!state.queue.length) startPractice(state.part);
      const q = state.queue.shift();
      state.count++;
      $('qcount').textContent = 'Aufgabe ' + state.count;
      render(instance(q));
    } else if (state.mode === 'test') {
      const t = state.test;
      if (t.i >= t.items.length) return finishTest();
      $('qcount').textContent = 'Frage ' + (t.i + 1) + ' von ' + t.items.length;
      render(t.items[t.i]);
      $('testProg').style.width = (t.i / t.items.length * 100) + '%';
    }
  }

  function check() {
    if (answered || !cur || !hasAnswer(cur)) return;
    answered = true;
    const g = grade(cur);
    const q = cur.q;
    showSolution(cur, g);
    R.answer(g.ok, PARTS[q.part].short);
    if (g.ok) {
      if (!tries[q.id]) mastered[q.id] = true; else { tries[q.id] = Math.max(0, tries[q.id] - 1); if (!tries[q.id]) mastered[q.id] = true; }
      setFeedback('good', pick(['Richtig!', 'Super!', 'Genau!', 'Stark!']) + ' ' + (q.why || ''));
    } else {
      tries[q.id] = (tries[q.id] || 0) + 1; delete mastered[q.id];
      // Falsches kommt bald wieder – und später noch einmal
      state.queue.splice(Math.min(3, state.queue.length), 0, q);
      state.queue.splice(Math.min(9, state.queue.length), 0, q);
      const extra = q.type === 'mapclick' && cur.hit ? ' Du hast auf <b>' + esc(cur.hit === 'Nebenmeer' ? 'ein Nebenmeer (kein Weltmeer)' : cur.hit) + '</b> geklickt.' : '';
      const part = g.total ? ' (' + g.right + ' von ' + g.total + ' richtig)' : '';
      setFeedback('bad', 'Leider falsch' + part + '.' + extra + ' Richtig: ' + esc(g.sol) + (q.why && !g.total ? ' – ' + q.why : ''));
    }
    R.save('mastered', mastered); R.save('tries', tries);
    const pp = partProgress(q.part);
    if (pp.done === pp.total && !R.isDone(PARTS[q.part].name)) { R.done(PARTS[q.part].name); setFeedback('good', PARTS[q.part].name + ' geschafft – du hast jede Aufgabe einmal richtig gelöst! Übe weiter oder mach den Probetest.'); }
    drawSide();
    updateMain();
  }

  // ---------- Probetest ----------
  function startTest() {
    state.mode = 'test'; state.part = null;
    const parts = THEMES[state.theme].parts;
    const items = [];
    parts.forEach(p => {
      // je Teil 6 Aufgaben, möglichst verschiedene Aufgabenarten
      const pool = shuffle(partItems(p)); const used = {}; const take = [];
      pool.forEach(q => { if (take.length < 6 && (used[q.type] || 0) < 2) { take.push(q); used[q.type] = (used[q.type] || 0) + 1; } });
      pool.forEach(q => { if (take.length < 6 && !take.includes(q)) take.push(q); });
      take.forEach(q => items.push(instance(q)));
    });
    state.test = { items: shuffle(items), i: 0, res: [] };
    buildChrome();
    next();
  }
  function saveTestAnswer() {
    if (!cur || !hasAnswer(cur)) return;
    const g = grade(cur);
    state.test.res.push({ it: cur, g });
    R.answer(g.ok, PARTS[cur.q.part].short);
    state.test.i++;
    next();
  }
  function promptText(it) {
    const q = it.q;
    if (q.type === 'tf') return 'Stimmt das? „' + q.s + '“';
    if (q.type === 'coord') return 'Koordinaten des roten Punktes';
    if (q.type === 'coordclick') return 'Punkt mit ' + it.correct;
    if (q.type === 'gridfind') return 'Feld von ' + it.target.name;
    if (q.type === 'gridclick') return 'Feld ' + it.field + ' anklicken';
    if (q.type === 'swatch') return 'Höhenstufe zur Farbe';
    if (q.type === 'layers') return (it.ask === 'alt' ? 'ältester' : 'jüngster') + ' Fund';
    if (q.type === 'mapname') return 'markierter Kontinent';
    return (q.q || '').replace(/<[^>]+>/g, '');
  }
  function finishTest() {
    const res = state.test.res;
    const max = res.reduce((a, r) => a + r.it.max, 0), pts = res.reduce((a, r) => a + r.g.pts, 0);
    const pc = Math.round(pts / max * 100);
    const byPart = {};
    res.forEach(r => { const p = r.it.q.part; byPart[p] = byPart[p] || [0, 0]; byPart[p][0] += r.g.pts; byPart[p][1] += r.it.max; });
    const wrong = res.filter(r => !r.g.ok);
    R.round({ score: pts, total: max, label: 'Probetest ' + THEMES[state.theme].name, wrong: wrong.map(r => promptText(r.it) + ' → ' + r.g.sol) });
    $('testProg').style.width = '100%';
    const msg = pc >= 90 ? 'Ausgezeichnet – du bist bestens vorbereitet!' : pc >= 75 ? 'Sehr gut! Schau dir die Fehler unten noch einmal an.' : pc >= 50 ? 'Gut gemacht – aber übe die schwächeren Teile noch.' : 'Da geht noch mehr. Übe die Teile mit wenig Punkten noch einmal.';
    $('qprompt').innerHTML = 'Probetest beendet: ' + esc(THEMES[state.theme].name);
    qa().innerHTML = '<div class="result"><div><span class="bigscore">' + pts + ' / ' + max + '</span> <span class="hos-pill">' + pc + ' %</span></div><div class="hos-merke">' + msg + '</div>' +
      '<div class="partlist">' + THEMES[state.theme].parts.filter(p => byPart[p]).map(p => { const [a, b] = byPart[p]; return '<div class="pl"><span>' + PARTS[p].name + '</span><span>' + a + ' / ' + b + '</span><div class="hos-progress"><span style="width:' + (a / b * 100) + '%"></span></div></div>'; }).join('') + '</div>' +
      (wrong.length ? '<h4 style="margin:4px 0 0">Das solltest du noch üben:</h4><div class="reslist">' + wrong.map(r => '<div>' + esc(promptText(r.it)) + '<br>→ <b>' + esc(r.g.sol) + '</b></div>').join('') + '</div>' : '<div class="hos-pill good">Alles richtig!</div>') + '</div>';
    state.mode = 'result';
    setFeedback(pc >= 75 ? 'good' : 'warn', 'Dein Ergebnis ist unter „Meine Ergebnisse“ gespeichert.');
    updateMain();
  }

  // ---------- Oberfläche ----------
  function setFeedback(kind, html) { const f = $('feedback'); f.className = 'hos-feedback' + (kind ? ' ' + kind : ''); f.innerHTML = html; }
  function updateMain() {
    const b = $('mainBtn'), tip = $('tipBtn');
    tip.hidden = state.mode !== 'ueben';
    if (state.mode === 'start') { b.textContent = 'Los geht\'s'; b.disabled = false; return; }
    if (state.mode === 'result') { b.textContent = 'Neuer Probetest'; b.disabled = false; return; }
    if (state.mode === 'test') { b.textContent = state.test.i + 1 >= state.test.items.length ? 'Abgeben' : 'Weiter →'; b.disabled = !(cur && hasAnswer(cur)); return; }
    if (answered) { b.textContent = 'Weiter →'; b.disabled = false; }
    else { b.textContent = 'Prüfen'; b.disabled = !(cur && hasAnswer(cur)); }
  }
  function mainAction() {
    if (state.mode === 'start') return startPractice(THEMES[state.theme].parts[0]);
    if (state.mode === 'result') return startTest();
    if (state.mode === 'test') return saveTestAnswer();
    if (answered) next(); else check();
  }
  $('mainBtn').addEventListener('click', mainAction);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && !$('mainBtn').disabled && !document.getElementById('hosr-ov')) { e.preventDefault(); mainAction(); } });
  $('tipBtn').addEventListener('click', () => {
    if (!cur || state.mode !== 'ueben') return;
    const box = $('merkeBox'); if (box) { box.open = true; box.scrollIntoView({ block: 'nearest' }); }
    setFeedback('warn', 'Schau rechts in den Merkkasten – dort steht alles, was du für diese Aufgabe brauchst.');
  });

  function buildChrome() {
    document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.theme === state.theme));
    const parts = THEMES[state.theme].parts;
    $('partSteps').innerHTML = parts.map(p => {
      const pp = partProgress(p);
      return '<button type="button" class="hos-step' + (state.part === p && state.mode === 'ueben' ? ' current' : '') + (pp.done === pp.total ? ' done' : '') + '" data-p="' + p + '">' + PARTS[p].short + '</button>';
    }).join('') + '<button type="button" class="hos-step' + (state.mode === 'test' || state.mode === 'result' ? ' current' : '') + '" data-test="1">Probetest</button>';
    $('partSteps').querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => startPractice(b.dataset.p)));
    $('partSteps').querySelector('[data-test]').addEventListener('click', startTest);
    $('modePill').textContent = state.mode === 'ueben' ? 'Übungsmodus' : 'Probetest';
    $('modePill').hidden = state.mode === 'start';
    document.querySelector('.hos-stage').classList.toggle('full', state.mode === 'start');
    $('qpanel').classList.toggle('start', state.mode === 'start');
    if (state.mode !== 'start') {
      $('qpanel').innerHTML = '<div class="qhead"><span class="qlabel" id="qpart"></span><span class="qcount" id="qcount"></span>' + (state.mode === 'test' ? '<span class="hos-spacer"></span><div class="hos-progress" style="width:200px"><span id="testProg"></span></div>' : '') + '</div><p class="qprompt" id="qprompt"></p><div class="qarea" id="qarea"></div>';
      $('qpart').textContent = state.mode === 'ueben' ? PARTS[state.part].name : 'Probetest: ' + THEMES[state.theme].name;
    }
    drawSide();
    updateMain();
  }

  function drawSide() {
    const parts = THEMES[state.theme].parts;
    let h = '<div class="hos-panel-title">Dein Fortschritt</div><div class="partlist">' + parts.map(p => {
      const pp = partProgress(p);
      return '<div class="pl' + (p === state.part ? ' cur' : '') + '"><span>' + PARTS[p].short + '</span><span>' + pp.done + ' / ' + pp.total + '</span><div class="hos-progress"><span style="width:' + (pp.done / pp.total * 100) + '%"></span></div></div>';
    }).join('') + '</div>';
    if (state.mode === 'ueben') {
      const P2 = PARTS[state.part];
      h += '<details class="hos-merke merke" id="merkeBox"><summary><b>MERKE</b> – zum Nachschauen</summary><ul>' + P2.merke.map(m => '<li>' + m + '</li>').join('') + '</ul></details>';
      h += '<div class="hoshint"><img src="/assets/minihos/' + P2.img + '.webp?v=2" alt="" onerror="this.remove()"><span>Jede Aufgabe einmal richtig = Balken voll. Was du falsch hast, kommt bald wieder.</span></div>';
    } else if (state.mode === 'test') {
      h += '<div class="hos-merke">Im Probetest gibt es keine Tipps und keine Auflösung zwischendurch – wie bei der echten LZK. Am Ende siehst du deine Punkte und deine Fehler.</div>';
    }
    $('side').innerHTML = h;
  }

  function welcome() {
    state.mode = 'start'; state.part = null;
    buildChrome();
    const t = THEMES[state.theme];
    const who = state.theme === 'erde' ? 'ZuB' : 'HoS';
    $('qpanel').innerHTML = '<div class="hero"><div class="hero-main"><span class="over">LZK-Vorbereitung · ' + who + '</span>' +
      '<h2>' + t.name + '</h2><p>Übe alle drei Teile deiner Lernunterlage. Gefragt wird nur, was in der Unterlage steht.</p>' +
      '<div class="levels">' + t.parts.map(p => { const pp = partProgress(p); return '<button type="button" class="lvl" data-p="' + p + '"><span>' + PARTS[p].name.replace(/^Teil (\d) · /, '<small>Teil $1</small>') + '</span><em>' + pp.done + ' / ' + pp.total + '</em></button>'; }).join('') + '</div>' +
      '<div><button type="button" class="hos-btn primary" id="heroTest">Probetest starten →</button></div></div>' +
      '<div class="rules"><b>So lernst du</b><ul>' +
      '<li><b>Üben:</b> Nach jeder Antwort siehst du sofort, ob sie stimmt – mit Erklärung.</li>' +
      '<li>Was du falsch hast, kommt bald noch einmal.</li>' +
      '<li>Der Balken ist voll, wenn du jede Aufgabe einmal richtig gelöst hast.</li>' +
      '<li><b>Tipp</b> öffnet den Merkkasten.</li>' +
      '<li><b>Probetest:</b> 18 gemischte Fragen wie bei der LZK, die Auflösung gibt es am Ende.</li></ul>' +
      '<img src="/assets/minihos/MiniHoS_Forschen_Globus.webp?v=2" alt="" onerror="this.remove()"></div></div>';
    $('qpanel').querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => startPractice(b.dataset.p)));
    $('heroTest').addEventListener('click', startTest);
    setFeedback('', 'Wähle oben einen Teil zum Üben oder starte den Probetest.');
    updateMain();
  }

  document.querySelectorAll('#themeSeg button').forEach(b => b.addEventListener('click', () => { state.theme = b.dataset.theme; R.save('theme', state.theme); welcome(); }));
  state.theme = R.load('theme', 'erde');
  welcome();
  window.__VU = { BANK, oceanAt, grade, instance, render, state, startPractice, check: () => check(), hasAnswer: () => hasAnswer(cur), cur: () => cur };
})();
</script>
</body>
</html>
