                            <th className={styles.th}>Richtig ✅ (Ersatzinfinitiv)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td className={styles.td}>Mit Vollverb</td>
                            <td className={styles.td}>Er hat lernen <em>gemusst</em>.</td>
                            <td className={styles.td}>Er hat lernen <strong>müssen</strong>.</td>
                        </tr>
                        <tr>
                            <td className={styles.td}>Mit Vollverb</td>
                            <td className={styles.td}>Wir haben gehen <em>gewollt</em>.</td>
                            <td className={styles.td}>Wir haben gehen <strong>wollen</strong>.</td>
                        </tr>
                        <tr>
                            <td className={styles.td}>Ohne Vollverb (selten)</td>
                            <td className={styles.td}>-</td>
                            <td className={styles.td}>Ich habe das nicht <strong>gewollt</strong>.</td>
                        </tr>
                        </tbody>
                    </table>
                    </div>

                    <div className={styles.merkbox}>
                        <span className={styles.merkTitle}><Info size={18}/> Merke</span>
                        <p className="text-slate-700">
                        Sobald ein <strong>zweites Verb</strong> (Vollverb) im Satz steht, verwandelt sich das Partizip II des Modalverbs (gemusst, gekonnt) zurück in den <strong>Infinitiv</strong> (müssen, können). Das nennt man "Ersatzinfinitiv".
                        </p>
                    </div>
                    </>
                ),
                worksheet: (
                    <>
                    <div className={styles.wsTask}>
                        <h4 className={styles.wsTaskTitle}>Aufgabe 1: Bilde den Imperativ (Befehlsform)</h4>
                        <p className="mb-2">Achte besonders bei den starken Verben auf den Vokalwechsel in der Einzahl (Du-Form)!</p>
                        <table className={styles.table}>
                        <thead>
                            <tr>
                            <th className={styles.th}>Verb</th>
                            <th className={styles.th}>Du-Form (Sg.)</th>
                            <th className={styles.th}>Ihr-Form (Pl.)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                            <td className={styles.td}>gehen</td>
                            <td className={styles.td}>Geh!</td>
                            <td className={styles.td}>Geht!</td>
                            </tr>
                            <tr>
                            <td className={styles.td}>lesen</td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            </tr>
                            <tr>
                            <td className={styles.td}>sprechen</td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            </tr>
                            <tr>
                            <td className={styles.td}>nehmen</td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            </tr>
                             <tr>
                            <td className={styles.td}>helfen</td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            <td className={styles.td}><span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></td>
                            </tr>
                        </tbody>
                        </table>
                    </div>

                    <div className={styles.wsTask}>
                        <h4 className={styles.wsTaskTitle}>Aufgabe 2: Modalverben im Perfekt</h4>
                        <p className="mb-2">Setze die Sätze ins <strong>Perfekt</strong>. Denke an den Ersatzinfinitiv!</p>
                        <div className="space-y-4">
                        <div>
                            1. Er muss viel lernen. →<br/>
                            Er hat viel lernen <span className={styles.wsInput}>müssen</span>.
                        </div>
                        <div>
                            2. Wir wollen ins Kino gehen. →<br/>
                            Wir haben ins Kino gehen <span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>.
                        </div>
                        <div>
                            3. Sie kann die Aufgabe lösen. →<br/>
                            Sie hat die Aufgabe lösen <span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>.
                        </div>
                        <div>
                            4. Ihr dürft das nicht machen. →<br/>
                            Ihr habt das nicht machen <span className={styles.wsInput}>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>.
                        </div>
                        </div>
                    </div>
                    </>
                )
                }
            };

            const navItems = [
                { id: 'basics', label: 'Grundbegriffe' },
                { id: 'stems', label: 'Starke/Schwache Verben' },
                { id: 'tenses', label: 'Zeitformen' },
                { id: 'voice', label: 'Aktiv & Passiv' },
                { id: 'konjunktiv', label: 'Konjunktiv I & II' },
                { id: 'imperativ', label: 'Imperativ & Modalverben' },
            ];

            // Helper function to reset view when changing tabs
            const handleTabChange = (tabId) => {
                setActiveTab(tabId);
                setViewMode('theory'); // Reset to theory view on tab change
            };

            return (
                <div className={styles.appContainer}>
                <div className="flex flex-col md:flex-row min-h-screen">
                    
                    {/* Sidebar Navigation - Hidden on Print */}
                    <aside className={styles.sidebar}>
                    <div className="p-6 border-b border-slate-200">
                        <div className="flex items-center gap-2 text-red-700 font-bold text-xl">
                        <BookOpen size={24} />
                        <span>Deutsch 8.</span>
                        </div>
                    </div>
                    <nav className="p-4">
                        {navItems.map((item) => (
                        <button
                            key={item.id}
                            onClick={() => handleTabChange(item.id)}
                            className={`${styles.navItem} ${activeTab === item.id ? styles.navItemActive : styles.navItemInactive}`}
                        >
                            <span className="flex-1">{item.label}</span>
                            {activeTab === item.id && <ChevronRight size={16} />}
                        </button>
                        ))}
                    </nav>
                    
                    <div className="p-6 mt-auto text-xs text-slate-400">
                        <p>© HoS-Lernmaterial</p>
                        <p>Stand: 2026</p>
                    </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className={styles.mainContent}>
                    {/* Header */}
                    <header className={styles.header}>
                        <div>
                        <h1 className={styles.title}>Das Verb (Zeitwort)</h1>
                        <p className={styles.subtitle}>Lernunterlage für die 8. Schulstufe</p>
                        </div>
                        <button 
                        onClick={handlePrint} 
                        className={styles.printBtn}
                        title="Aktuelle Seite drucken"
                        >
                        <Printer size={18} />
                        <span>{viewMode === 'theory' ? 'Lernkartei drucken' : 'Arbeitsblatt drucken'}</span>
                        </button>
                    </header>

                    {/* Print specific header (only visible when printing) */}
                    <div className={styles.printHeader}>
                        <div className="flex justify-between items-end">
                            <div>
                                <h1 className="text-2xl font-bold">{viewMode === 'theory' ? 'Lernkartei' : 'Arbeitsblatt'}: {content[activeTab].title}</h1>
                                <p className="text-sm text-slate-600">Thema: Verben • 8. Schulstufe • Deutsch</p>
                            </div>
                            {/* Print Logo/Date area if it's a worksheet */}
                            {viewMode === 'worksheet' && (
                                <div className="text-right text-sm">
                                    <p>Name: ______________________</p>
                                    <p className="mt-2">Datum: ______________________</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Active Card Content */}
                    <div className={styles.card}>
                        {/* View Mode Switcher (Theory vs Worksheet) */}
                        <div className={styles.modeSwitch}>
                            <button 
                                onClick={() => setViewMode('theory')}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${viewMode === 'theory' ? 'bg-white text-red-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                            >
                                <div className="flex items-center gap-2">
                                    <GraduationCap size={16}/>
                                    Lernstoff
                                </div>
                            </button>
                            <button 
                                onClick={() => setViewMode('worksheet')}
                                className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${viewMode === 'worksheet' ? 'bg-white text-red-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                            >
                                <div className="flex items-center gap-2">
                                    <FileText size={16}/>
                                    Übungsblatt
                                </div>
                            </button>
                        </div>

                        {/* Inner Card Header */}
                        <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100 print:border-0">
                        <div className="p-2 bg-red-100 text-red-700 rounded-lg print:hidden">
                            {content[activeTab].icon}
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800">
                            {content[activeTab].title} {viewMode === 'worksheet' && <span className="text-slate-400 font-normal text-lg ml-2">(Übungen)</span>}
                        </h2>
                        </div>
                        
                        {/* Content Body */}
                        <div>
                        {viewMode === 'theory' ? content[activeTab].theory : content[activeTab].worksheet}
                        </div>
                    </div>
                    </main>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VerbLearningApp />);
    </script>
</body>
</html>
