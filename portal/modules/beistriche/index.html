  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // ---------------------------------
    // Logiken & Level
    // ---------------------------------
    const LEVELS = {
      standard: {
        label: "Standard (MS)",
        short: "Pflichtfälle – prüfungsfest",
        tags: ["Pflichtfälle", "klare Signalwörter", "ohne Zweifelsfälle"]
      },
      ahs: {
        label: "AHS-Plus",
        short: "Plus: komplex & Zweifelsfälle",
        tags: ["Komplexe Sätze", "Zweifelsfälle", "Optionales erklärt"]
      }
    };

    const CATEGORIES = ["Gemischt","Aufzählungen","Satzreihen","Nebensätze","Relativsätze","Infinitivgruppen","Einschübe","Wörtliche Rede","Zweifelsfälle"];

    // Alle Regeln unverändert
    const RULES = [
      { key:"satzkern", levels:["standard","ahs"], title:"Satzkern-Strategie (Prüfungstrick)", why:"Satzkerne (finite Verben) helfen dir, Teilsätze zu erkennen – aber sie ersetzen nicht die Kommaregeln.", signals:["Personalform finden (gehe, ging, kommt, hat, ist …)","Nebensatzstarter markieren (weil, dass, wenn …)","Relativwörter markieren (der/die/das …)"], examples:["Wenn es regnet, bleiben wir zu Hause. (2 Satzkerne: regnet / bleiben)","Er packte seine Sachen und ging nach Hause. (2 Verben, aber 1 Hauptsatz → kein Beistrich)"], notes:["Merke: „Mehrere Satzkerne“ heißt nicht automatisch „Komma“. Entscheidend ist: Nebensatz/Relativsatz (immer) oder zwei selbstständige Hauptsätze (oft möglich)."] },
      { key:"aufzaehlung", levels:["standard","ahs"], title:"1) Aufzählungen", why:"Aufzählungen werden mit Beistrich getrennt – vor dem letzten „und/oder“ meist kein Beistrich.", signals:["mehrere gleichartige Teile","Reihung: A, B und C"], examples:["laut, deutlich und höflich","Brot, Milch, Käse und Obst"], notes:["Kein Beistrich vor „und“ in der einfachen Aufzählung."] },
      { key:"nebensatz", levels:["standard","ahs"], title:"2) Nebensätze", why:"Nebensätze werden vom Hauptsatz durch Beistriche abgetrennt (am Anfang und/oder Ende).", signals:["weil, dass, wenn, obwohl, damit, während, bevor, nachdem, bis, falls, sobald, ob …"], examples:["Wenn es regnet, bleiben wir zu Hause.","Ich glaube, dass du recht hast."], notes:["Nebensatz = Einleitewort + Verb oft am Ende."] },
      { key:"relativsatz", levels:["standard","ahs"], title:"3) Relativsätze", why:"Relativsätze (Zusatzinfos zu Nomen) werden immer durch Beistriche abgetrennt.", signals:["der/die/das, den/dem, dessen/deren, welcher …, wo …"], examples:["Der Schüler, der heute fehlt, bekommt die Aufgabe."], notes:["Relativsatz-Test: Zusatzinfo weglassen – der Satz bleibt korrekt."] },
      { key:"satzreihe", levels:["standard","ahs"], title:"4) Satzreihen / zwei Hauptsätze", why:"Zwischen zwei selbstständigen Hauptsätzen steht häufig ein Beistrich – besonders bei aber, denn, sondern, doch, jedoch …", signals:["aber, denn, sondern, doch, jedoch, trotzdem, deshalb"], examples:["Ich wollte gehen, aber es regnete.","Wir lernen, denn morgen ist die Schularbeit."], notes:["Bei „und/oder“ ist das Komma zwischen Hauptsätzen oft möglich, aber nicht immer Pflicht (Lesbarkeit).","Wenn vor „und“ ein Nebensatz/Einschub endet, steht das Komma trotzdem."] },
      { key:"infinitiv", levels:["standard","ahs"], title:"5) Infinitivgruppen mit „zu“", why:"Bei um/ohne/(an)statt/außer/als … zu wird die Infinitivgruppe mit Beistrich abgetrennt.", signals:["um … zu","ohne … zu","statt/anstatt … zu","außer … zu","als … zu"], examples:["Ich lerne, um die Schularbeit zu schaffen.","Er ging, ohne sich zu verabschieden."], notes:["In der Schule als sicherer Standard: Bei diesen Einleitungen Beistrich setzen."] },
      { key:"einschub", levels:["standard","ahs"], title:"6) Einschübe/Appositionen", why:"Einschübe (Zusatzinfos) werden mit zwei Beistrichen abgetrennt.", signals:["Max, unser Klassensprecher, …","Der Laptop, ein Leihgerät, …"], examples:["Frau Huber, unsere Klassenvorständin, hilft uns."], notes:["Einschub-Test: Weglassen – Satz bleibt korrekt."] },
      { key:"rede", levels:["standard","ahs"], title:"7) Wörtliche Rede", why:"Bei Begleitsätzen („sagte er“) steht oft ein Beistrich zwischen Rede und Begleitsatz.", signals:["sagte, fragte, rief, antwortete, meinte"], examples:["„Komm sofort!“, sagte Mara.","Mara sagte: „Komm sofort!“"], notes:["Satzzeichen bleibt in den Anführungszeichen; Beistrich folgt danach, wenn der Begleitsatz anschließt."] },
      { key:"oewb_und", levels:["ahs"], title:"Zweifelsfall: Komma vor „und“ (zwei Hauptsätze)", why:"Verbinden „und/oder“ zwei vollständige Hauptsätze, kann ein Komma zur besseren Lesbarkeit gesetzt werden – muss aber nicht.", signals:["zwei vollständige Hauptsätze","langer Satz / Subjektwechsel"], examples:["Er packte seine Sachen(,) und er ging nach Hause."], notes:["In dieser App werden solche Aufgaben als „optional“ markiert und beide Lösungen akzeptiert."] },
      { key:"oewb_infinitiv_optional", levels:["ahs"], title:"Zweifelsfall: kurzer Infinitiv ohne Einleitung", why:"Bei kurzen Infinitivgruppen ohne um/ohne/statt… kann das Komma möglich sein, muss aber nicht (z. B. zur Gliederung).", signals:["Er versprach(,) zu helfen.","Sie beschloss(,) nicht zu kommen."], examples:["Er versprach(,) zu helfen."], notes:["In der App: beide Varianten gelten als korrekt, wenn es als optional markiert ist."] }
    ];

    const RULE_TO_CAT = {
      "satzkern": "Gemischt", "aufzaehlung": "Aufzählungen", "nebensatz": "Nebensätze", "relativsatz": "Relativsätze",
      "satzreihe": "Satzreihen", "infinitiv": "Infinitivgruppen", "einschub": "Einschübe", "rede": "Wörtliche Rede",
      "oewb_und": "Zweifelsfälle", "oewb_infinitiv_optional": "Zweifelsfälle"
    };

    // Alle Übungen inkl. optional-Logiken unverändert
    const EXERCISES = [
      { id:"A1", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"easy", prompt:"Setze die Beistriche in der Aufzählung.", tokens:["Ich","kaufe","Brot","Milch","Käse","und","Obst."], solutions:[[2,3]], explain:"Aufzählung: Brot, Milch, Käse und Obst." },
      { id:"A2", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"easy", prompt:"Setze die Beistriche in der Aufzählung.", tokens:["Er","spricht","laut","deutlich","und","höflich."], solutions:[[2]], explain:"Aufzählung: laut, deutlich und höflich." },
      { id:"A3", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"medium", prompt:"Setze die Beistriche. Achte auf das letzte „und“.", tokens:["Wir","brauchen","Hefte","Stifte","Lineal","und","Radiergummi."], solutions:[[2,3]], explain:"Aufzählung: Hefte, Stifte, Lineal und Radiergummi." },
      { id:"A4", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"medium", prompt:"Setze die Beistriche in der Aufzählung.", tokens:["Im","Rucksack","sind","Bücher","Hefte","Stifte","und","ein","Taschenrechner."], solutions:[[3,4]], explain:"Aufzählung: Bücher, Hefte, Stifte und ein Taschenrechner." },
      { id:"A5", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"easy", prompt:"Setze die Beistriche in der Aufzählung.", tokens:["Wir","trafen","uns","gestern","heute","und","morgen."], solutions:[[3]], explain:"Aufzählung: gestern, heute und morgen." },
      { id:"S1", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"easy", prompt:"Zwei Hauptsätze mit „aber“: Setze den Beistrich.", tokens:["Ich","wollte","gehen","aber","es","regnete."], solutions:[[2]], explain:"Ich wollte gehen, aber es regnete." },
      { id:"S2", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"easy", prompt:"Zwei Hauptsätze mit „denn“: Setze den Beistrich.", tokens:["Wir","lernen","denn","morgen","ist","die","Schularbeit."], solutions:[[1]], explain:"Wir lernen, denn morgen ist die Schularbeit." },
      { id:"S3", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"medium", prompt:"Zwei Hauptsätze mit „sondern“: Setze den Beistrich.", tokens:["Ich","nehme","nicht","den","Bus","sondern","ich","gehe","zu","Fuß."], solutions:[[4]], explain:"Ich nehme nicht den Bus, sondern ich gehe zu Fuß." },
      { id:"S4", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"medium", prompt:"Zwei Hauptsätze mit „doch“: Setze den Beistrich.", tokens:["Ich","war","müde","doch","ich","machte","weiter."], solutions:[[2]], explain:"Ich war müde, doch ich machte weiter." },
      { id:"U1", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"hard", prompt:"Hier steht vor „und“ ein Beistrich, weil ein Nebensatz endet. Setze alle Beistriche.", tokens:["Ich","lerne","weil","ich","morgen","eine","Schularbeit","habe","und","ich","wiederhole","die","Regeln."], solutions:[[1,7]], explain:"Ich lerne, weil ich morgen eine Schularbeit habe, und ich wiederhole die Regeln." },
      { id:"U2", levels:["standard","ahs"], cat:"Satzreihen", mode:"detective", diff:"medium", prompt:"Hier ist ein Beistrich falsch. Korrigiere den Satz.", tokens:["Er","packte","seine","Sachen","und","ging","nach","Hause."], initial:[3], solutions:[[]], explain:"Kein Beistrich: ein Hauptsatz mit zwei Prädikaten (packte / ging)." },
      { id:"N1", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"easy", prompt:"Nebensatz am Anfang: Setze die Beistriche.", tokens:["Wenn","es","regnet","bleiben","wir","zu","Hause."], solutions:[[2]], explain:"Wenn es regnet, bleiben wir zu Hause." },
      { id:"N2", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"easy", prompt:"Nebensatz am Ende: Setze die Beistriche.", tokens:["Wir","bleiben","zu","Hause","weil","es","regnet."], solutions:[[3]], explain:"Wir bleiben zu Hause, weil es regnet." },
      { id:"N3", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"medium", prompt:"Objektsatz mit „dass“: Setze den Beistrich.", tokens:["Ich","glaube","dass","du","recht","hast."], solutions:[[1]], explain:"Ich glaube, dass du recht hast." },
      { id:"N4", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"medium", prompt:"Setze alle nötigen Beistriche.", tokens:["Obwohl","er","krank","war","ging","er","zur","Schule."], solutions:[[3]], explain:"Obwohl er krank war, ging er zur Schule." },
      { id:"N5", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"hard", prompt:"Zwei Nebensätze: Setze die Beistriche.", tokens:["Ich","blieb","daheim","weil","ich","müde","war","obwohl","ich","mitkommen","wollte."], solutions:[[2,6]], explain:"Ich blieb daheim, weil ich müde war, obwohl ich mitkommen wollte." },
      { id:"N6", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"medium", prompt:"Setze den Beistrich.", tokens:["Ich","weiß","nicht","ob","er","Zeit","hat."], solutions:[[2]], explain:"Ich weiß nicht, ob er Zeit hat." },
      { id:"R1", levels:["standard","ahs"], cat:"Relativsätze", mode:"insert", diff:"easy", prompt:"Setze die Beistriche beim Relativsatz.", tokens:["Der","Schüler","der","heute","fehlt","bekommt","die","Aufgabe."], solutions:[[1,4]], explain:"Der Schüler, der heute fehlt, bekommt die Aufgabe." },
      { id:"R2", levels:["standard","ahs"], cat:"Relativsätze", mode:"insert", diff:"easy", prompt:"Setze die Beistriche beim Relativsatz.", tokens:["Das","Buch","das","ich","gestern","gelesen","habe","war","spannend."], solutions:[[1,6]], explain:"Das Buch, das ich gestern gelesen habe, war spannend." },
      { id:"R3", levels:["standard","ahs"], cat:"Relativsätze", mode:"insert", diff:"medium", prompt:"Relativsatz am Ende: Setze den Beistrich.", tokens:["Das","ist","der","Ort","an","dem","wir","uns","treffen."], solutions:[[3]], explain:"Das ist der Ort, an dem wir uns treffen." },
      { id:"R4", levels:["ahs"], cat:"Relativsätze", mode:"insert", diff:"hard", prompt:"Zwei Relativsätze: Setze alle Beistriche.", tokens:["Der","Film","der","gestern","lief","den","wir","gesehen","haben","war","lustig."], solutions:[[1,4,8]], explain:"Der Film, der gestern lief, den wir gesehen haben, war lustig." },
      { id:"I1", levels:["standard","ahs"], cat:"Infinitivgruppen", mode:"insert", diff:"easy", prompt:"„um … zu“: Setze den Beistrich.", tokens:["Ich","lerne","um","die","Schularbeit","zu","schaffen."], solutions:[[1]], explain:"Ich lerne, um die Schularbeit zu schaffen." },
      { id:"I2", levels:["standard","ahs"], cat:"Infinitivgruppen", mode:"insert", diff:"easy", prompt:"„ohne … zu“: Setze den Beistrich.", tokens:["Er","ging","ohne","sich","zu","verabschieden."], solutions:[[1]], explain:"Er ging, ohne sich zu verabschieden." },
      { id:"I3", levels:["standard","ahs"], cat:"Infinitivgruppen", mode:"insert", diff:"medium", prompt:"„statt … zu“: Setze den Beistrich.", tokens:["Statt","zu","lernen","spielte","er","am","Handy."], solutions:[[2]], explain:"Statt zu lernen, spielte er am Handy." },
      { id:"I4", levels:["standard","ahs"], cat:"Infinitivgruppen", mode:"insert", diff:"medium", prompt:"„anstatt … zu“: Setze den Beistrich.", tokens:["Anstatt","sich","zu","entschuldigen","lachte","er","nur."], solutions:[[3]], explain:"Anstatt sich zu entschuldigen, lachte er nur." },
      { id:"E1", levels:["standard","ahs"], cat:"Einschübe", mode:"insert", diff:"easy", prompt:"Setze die Beistriche beim Einschub.", tokens:["Frau","Huber","unsere","Klassenvorständin","hilft","uns."], solutions:[[1,3]], explain:"Frau Huber, unsere Klassenvorständin, hilft uns." },
      { id:"E2", levels:["standard","ahs"], cat:"Einschübe", mode:"insert", diff:"medium", prompt:"Setze die Beistriche bei der Apposition.", tokens:["Der","Laptop","ein","Leihgerät","der","Schule","ist","neu."], solutions:[[1,5]], explain:"Der Laptop, ein Leihgerät der Schule, ist neu." },
      { id:"E3", levels:["ahs"], cat:"Einschübe", mode:"insert", diff:"hard", prompt:"Einschub + Nebensatz: Setze alle Beistriche.", tokens:["Max","unser","Klassensprecher","sagte","dass","wir","früher","gehen","dürfen."], solutions:[[0,2,3]], explain:"Max, unser Klassensprecher, sagte, dass wir früher gehen dürfen." },
      { id:"W1", levels:["standard","ahs"], cat:"Wörtliche Rede", mode:"insert", diff:"easy", prompt:"Wörtliche Rede + Begleitsatz: Setze den Beistrich.", tokens:["„Komm","sofort!“","sagte","Mara."], solutions:[[1]], explain:"„Komm sofort!“, sagte Mara." },
      { id:"W2", levels:["standard","ahs"], cat:"Wörtliche Rede", mode:"insert", diff:"medium", prompt:"Wörtliche Rede (Frage) + Begleitsatz: Setze den Beistrich.", tokens:["„Kommst","du","mit?“","fragte","er."], solutions:[[2]], explain:"„Kommst du mit?“, fragte er." },
      { id:"W3", levels:["standard","ahs"], cat:"Wörtliche Rede", mode:"choice", diff:"medium", prompt:"Welche Schreibweise ist richtig?", options:["„Ich komme gleich“, sagte Lena.","„Ich komme gleich“ sagte Lena.","„Ich komme gleich“, sagte Lena","„Ich komme gleich“. sagte Lena."], correctIndex:0, explain:"Beistrich nach der wörtlichen Rede, wenn danach der Begleitsatz folgt." },
      { id:"W4", levels:["ahs"], cat:"Wörtliche Rede", mode:"choice", diff:"hard", prompt:"Welche Schreibweise ist richtig?", options:["Lena sagte, „ich komme gleich!“","Lena sagte: „Ich komme gleich!“","Lena sagte; „Ich komme gleich!“","Lena sagte „Ich komme gleich!“."], correctIndex:1, explain:"Begleitsatz vor der Rede meist mit Doppelpunkt." },
      { id:"G1", levels:["standard","ahs"], cat:"Gemischt", mode:"insert", diff:"medium", prompt:"Setze alle nötigen Beistriche.", tokens:["Ich","weiß","dass","du","heute","kommst","aber","ich","bin","trotzdem","nervös."], solutions:[[1,5]], explain:"Ich weiß, dass du heute kommst, aber ich bin trotzdem nervös." },
      { id:"G2", levels:["standard","ahs"], cat:"Gemischt", mode:"insert", diff:"hard", prompt:"Setze alle nötigen Beistriche (Relativsatz + Nebensatz).", tokens:["Die","Schülerin","die","immer","pünktlich","ist","lernt","weil","sie","besser","werden","will."], solutions:[[1,5,6]], explain:"Die Schülerin, die immer pünktlich ist, lernt, weil sie besser werden will." },
      { id:"G3", levels:["standard","ahs"], cat:"Gemischt", mode:"insert", diff:"hard", prompt:"Setze alle nötigen Beistriche (Infinitivgruppe + Nebensatz).", tokens:["Ich","bleibe","daheim","um","in","Ruhe","zu","lernen","weil","morgen","die","Schularbeit","ist."], solutions:[[2,7]], explain:"Ich bleibe daheim, um in Ruhe zu lernen, weil morgen die Schularbeit ist." },
      { id:"O1", levels:["ahs"], cat:"Zweifelsfälle", mode:"insert", diff:"hard", prompt:"Optional: Zwei Hauptsätze mit „und“. Beides gilt hier als korrekt.", tokens:["Er","packte","seine","Sachen","und","er","ging","nach","Hause."], solutions:[[],[3]], optional:true, explain:"Komma zwischen zwei Hauptsätzen mit „und“ ist möglich (Lesbarkeit), aber nicht immer Pflicht." },
      { id:"O2", levels:["ahs"], cat:"Zweifelsfälle", mode:"insert", diff:"medium", prompt:"Optional: Kurzer Infinitiv ohne Einleitung (beides korrekt).", tokens:["Er","versprach","zu","helfen."], solutions:[[],[1]], optional:true, explain:"Er versprach(,) zu helfen. (Komma möglich, nicht zwingend.)" },
      { id:"O3", levels:["ahs"], cat:"Zweifelsfälle", mode:"insert", diff:"hard", prompt:"Optional: Kurzer Infinitiv ohne Einleitung (beides korrekt).", tokens:["Sie","beschloss","nicht","zu","kommen."], solutions:[[],[1]], optional:true, explain:"Sie beschloss(,) nicht zu kommen. (Komma möglich, nicht zwingend.)" },
      // --- Beispiele (nur Vornamen) ---
      { id:"4C_A1", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"easy", prompt:"Setze die Beistriche in der Aufzählung.", tokens:["Maximilian","Martin","Paul","und","Tom","spielen","Fußball."], solutions:[[0,1,2]], explain:"Aufzählung: Maximilian, Martin, Paul und Tom spielen Fußball. (Kein Beistrich vor „und“.)" },
      { id:"4C_A2", levels:["standard","ahs"], cat:"Aufzählungen", mode:"insert", diff:"easy", prompt:"Setze die Beistriche in der Aufzählung.", tokens:["Hannah","Leonie","und","Lucia","arbeiten","gemeinsam","am","Plakat."], solutions:[[0]], explain:"Aufzählung: Hannah, Leonie und Lucia arbeiten gemeinsam am Plakat." },
      { id:"4C_N1", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"easy", prompt:"Setze die Beistriche beim Nebensatz.", tokens:["Wenn","Jonas","Zeit","hat","hilft","er","Fabio."], solutions:[[3]], explain:"Wenn Jonas Zeit hat, hilft er Fabio." },
      { id:"4C_N2", levels:["standard","ahs"], cat:"Nebensätze", mode:"insert", diff:"medium", prompt:"Setze die Beistriche beim Nebensatz.", tokens:["Fabian","lernt","weil","Sebastian","morgen","fragt."], solutions:[[1]], explain:"Fabian lernt, weil Sebastian morgen fragt." },
      { id:"4C_R1", levels:["standard","ahs"], cat:"Relativsätze", mode:"insert", diff:"medium", prompt:"Setze die Beistriche beim Relativsatz.", tokens:["Marco","der","das","Heft","vergessen","hat","leiht","sich","eines."], solutions:[[0,5]], explain:"Marco, der das Heft vergessen hat, leiht sich eines." },
      { id:"4C_I1", levels:["standard","ahs"], cat:"Infinitivgruppen", mode:"insert", diff:"easy", prompt:"Setze den Beistrich bei „um … zu“.", tokens:["Romy","lernt","um","die","Schularbeit","zu","schaffen."], solutions:[[1]], explain:"Romy lernt, um die Schularbeit zu schaffen." },
      { id:"4C_E1", levels:["standard","ahs"], cat:"Einschübe", mode:"insert", diff:"medium", prompt:"Setze die Beistriche beim Einschub.", tokens:["Tom","unser","Klassensprecher","verteilt","die","Blätter."], solutions:[[0,2]], explain:"Tom, unser Klassensprecher, verteilt die Blätter." },
      { id:"4C_W1", levels:["standard","ahs"], cat:"Wörtliche Rede", mode:"insert", diff:"easy", prompt:"Setze den Beistrich bei der wörtlichen Rede.", tokens:["„Bitte","leise!“","sagte","Florentina."], solutions:[[1]], explain:"„Bitte leise!“, sagte Florentina." },
      { id:"4C_S1", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"medium", prompt:"Setze den Beistrich zwischen den Hauptsätzen.", tokens:["Lennox","wollte","beginnen","aber","Christian","war","noch","nicht","bereit."], solutions:[[2]], explain:"Lennox wollte beginnen, aber Christian war noch nicht bereit." },
      { id:"4C_U1", levels:["standard","ahs"], cat:"Satzreihen", mode:"insert", diff:"hard", prompt:"Setze alle nötigen Beistriche. Achte auf das „und“.", tokens:["Sebastian","sagt","dass","Larissa","kommt","und","Maximilian","wartet."], solutions:[[1,4]], explain:"Sebastian sagt, dass Larissa kommt, und Maximilian wartet. (Komma vor „und“ schließt den Nebensatz.)" },
      { id:"4C_O1", levels:["ahs"], cat:"Zweifelsfälle", mode:"insert", diff:"hard", prompt:"Zwei Hauptsätze mit „und“. Beides gilt als korrekt.", tokens:["Paul","machte","die","Aufgabe","und","Martin","kontrollierte","sie."], solutions:[[],[3]], optional:true, explain:"Paul machte die Aufgabe(,) und Martin kontrollierte sie. (Optionaler Fall: Komma möglich, nicht Pflicht.)" }

    ];

    // Hilfsfunktionen
    // ----------------------------
    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
    function normalizePositions(posArr){ const s = new Set(posArr || []); return Array.from(s).sort((x,y)=>x-y); }
    function arrEq(a,b){ if(a.length !== b.length) return false; for(let i=0;i<a.length;i++) if(a[i] !== b[i]) return false; return true; }
    function isCorrect(userPos, solutions){ const u = normalizePositions(userPos); const solList = (solutions||[]).map(normalizePositions); return solList.some(sol => arrEq(u, sol)); }
    function bestSolutionForDisplay(userPos, solutions){
      const sols = (solutions||[]).map(normalizePositions);
      const u = normalizePositions(userPos||[]);
      const match = sols.find(s => arrEq(s,u));
      if(match) return match;
      const nonEmpty = sols.find(s => s.length>0);
      return nonEmpty || (sols[0] || []);
    }
    function buildSentence(tokens, commaAfterSet){
      const commaAfter = new Set((commaAfterSet||[]).map(Number));
      let out = "";
      for(let i=0;i<tokens.length;i++){ out += tokens[i]; if(i < tokens.length-1){ if(commaAfter.has(i)) out += ", "; else out += " "; } }
      return out;
    }
    function shuffle(arr){
      const a = arr.slice();
      for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function useStoredState(key, initial){
      const [v, setV] = useState(() => { try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; }catch(e){ return initial; } });
      useEffect(() => { try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }, [key, v]);
      return [v, setV];
    }
    function pickExercises({level, cat, count}){
      let pool = EXERCISES.filter(x => (x.levels||["standard","ahs"]).includes(level));
      if(cat && cat !== "Gemischt") pool = pool.filter(x => x.cat === cat);
      if(pool.length === 0){
        pool = EXERCISES.filter(x => (x.levels||["standard","ahs"]).includes(level) && x.cat === "Gemischt");
        if(pool.length === 0) pool = EXERCISES.filter(x => (x.levels||["standard","ahs"]).includes(level));
      }
      return shuffle(pool).slice(0, clamp(count, 1, pool.length));
    }

    // ----------------------------
    // UI Bausteine (Zen & Deutsch-Rot)
    // ----------------------------
    function Button({children, onClick, variant="primary", disabled=false, className=""}){
      const base = "inline-flex items-center justify-center rounded-xl px-5 py-2.5 text-[15px] font-bold shadow-sm transition active:translate-y-[1px] disabled:opacity-50 disabled:cursor-not-allowed";
      const styles = variant === "primary" ? "bg-red-600 text-white hover:bg-red-700" : variant === "ghost" ? "bg-white text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50 hover:text-slate-900" : "bg-slate-100 text-slate-800 hover:bg-slate-200";
      return <button className={`${base} ${styles} ${className}`} onClick={onClick} disabled={disabled}>{children}</button>;
    }

    function CommaEditor({tokens, value, onChange, readOnly=false, showSolution=false, solutionPositions=[]}){
      const positions = normalizePositions(value || []);
      const solSet = new Set(normalizePositions(solutionPositions || []));

      function toggle(i){
        if(readOnly) return;
        const s = new Set(positions);
        if(s.has(i)) s.delete(i); else s.add(i);
        onChange(Array.from(s).sort((a,b)=>a-b));
      }

      return (
        <div className="text-[20px] sm:text-[24px] leading-[2.2] text-slate-800 text-center px-2 py-6">
          {tokens.map((tok, i) => {
            const isLast = i === tokens.length - 1;
            const hasComma = positions.includes(i);
            const sol = solSet.has(i);
            return (
              <span key={i} className="mono">
                <span>{tok}</span>
                {!isLast && (
                  <span className="inline-flex items-center mx-1">
                    <button
                      className={[ "nosel inline-flex items-center justify-center rounded-lg px-2 py-0.5 text-lg font-bold transition-all", hasComma ? "bg-white ring-2 ring-red-500 text-red-700 shadow-sm translate-y-[-2px]" : "bg-transparent text-slate-300 hover:text-slate-500 hover:bg-slate-200", showSolution && sol ? "outline outline-2 outline-emerald-500 bg-emerald-50 text-emerald-800" : "" ].join(" ")}
                      onClick={() => toggle(i)} aria-label={hasComma ? "Beistrich entfernen" : "Beistrich setzen"}
                    >
                      {hasComma ? "," : "·"}
                    </button>
                  </span>
                )}
              </span>
            );
          })}
        </div>
      );
    }

    // ----------------------------
    // Screens
    // ----------------------------

    // 1. Home
    function ScreenHome({ level, setLevel, onOpenTopic, onStartMixed, onStartTest, onOpenChecklist }) {
      const activeRules = useMemo(() => RULES.filter(r => r.levels.includes(level)), [level]);

      return (
        <div className="fade-in max-w-3xl mx-auto">
          <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm ring-1 ring-slate-200 mb-8">
            <div className="flex items-center gap-3 mb-2">
              <h2 className="text-xl sm:text-2xl font-bold text-slate-900">Hallo! Schön, dass du da bist.</h2>
            </div>
            <p className="text-slate-600 mb-6">
              Beistriche können knifflig sein, aber wenn man die Satzkerne und ein paar Signalwörter kennt, wird es logisch.
              Welches Level brauchst du?
            </p>
            <div className="grid sm:grid-cols-2 gap-4">
              <button onClick={() => setLevel("standard")} className={`text-center p-4 rounded-xl transition ${level === "standard" ? "bg-red-50 ring-2 ring-red-500" : "bg-slate-50 ring-1 ring-slate-200 hover:bg-white"}`}>
                <div className="font-bold text-slate-900">{LEVELS.standard.label}</div>
              </button>
              <button onClick={() => setLevel("ahs")} className={`text-center p-4 rounded-xl transition ${level === "ahs" ? "bg-red-50 ring-2 ring-red-500" : "bg-slate-50 ring-1 ring-slate-200 hover:bg-white"}`}>
                <div className="font-bold text-slate-900">{LEVELS.ahs.label}</div>
              </button>
            </div>
          </div>

          <div className="flex flex-wrap items-center justify-between mb-4 px-2">
            <h3 className="text-lg font-bold text-slate-900">1. Regeln lernen & einzeln üben</h3>
            <button onClick={onOpenChecklist} className="text-sm font-bold text-red-600 hover:text-red-800 transition underline decoration-red-300 underline-offset-4">
              Zur Prüfungs-Checkliste & Hilfe
            </button>
          </div>

          <div className="grid sm:grid-cols-2 gap-3 mb-8">
            {activeRules.map(rule => (
              <button key={rule.key} onClick={() => onOpenTopic(rule)} className="text-left bg-white p-4 rounded-xl ring-1 ring-slate-200 hover:shadow-md hover:ring-red-400 transition flex justify-between items-center group">
                <div>
                  <div className="font-medium text-slate-800">{rule.title}</div>
                  {rule.levels.length === 1 && rule.levels[0] === "ahs" && (
                     <span className="inline-block mt-1 text-[11px] font-bold rounded bg-slate-800 text-white px-2 py-0.5">AHS-Plus</span>
                  )}
                </div>
                <svg className="w-5 h-5 text-slate-300 group-hover:text-red-500 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
              </button>
            ))}
          </div>

          <h3 className="text-lg font-bold text-slate-900 mb-4 px-2">2. Alles kreuz und quer</h3>
          <div className="grid sm:grid-cols-2 gap-3">
            <button onClick={onStartMixed} className="text-left bg-gradient-to-br from-slate-50 to-slate-100 p-5 rounded-xl ring-1 ring-slate-200 hover:shadow-md transition">
              <div className="font-bold text-slate-900 mb-1">Gemischtes Training</div>
              <div className="text-sm text-slate-600">Trainiere alle Regeln durcheinander ohne Zeitdruck.</div>
            </button>
            <button onClick={onStartTest} className="text-left bg-gradient-to-br from-red-50 to-rose-50 p-5 rounded-xl ring-1 ring-red-100 hover:shadow-md transition">
              <div className="font-bold text-red-900 mb-1">Prüfungs-Test</div>
              <div className="text-sm text-red-800">10 Aufgaben, eine Uhr läuft mit. Zeig, was du kannst!</div>
            </button>
          </div>
        </div>
      );
    }

    // 1b. Checkliste & Hilfe
    function ScreenChecklist({ level, onBack }) {
      return (
        <div className="fade-in max-w-3xl mx-auto">
          <button onClick={onBack} className="mb-6 flex items-center text-sm font-medium text-slate-500 hover:text-slate-800 transition">
            <svg className="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg> Zurück zur Übersicht
          </button>

          <div className="grid gap-6">
            <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm ring-1 ring-slate-200">
              <h2 className="text-xl font-bold text-slate-900 mb-4">Beistrich-Checkliste ({LEVELS[level].label})</h2>
              <ol className="list-decimal pl-5 text-sm text-slate-700 space-y-3">
                <li><b>Satzkerne finden</b> (finite Verben). Wie viele Teilsätze?</li>
                <li><b>Nebensatzstarter</b> (weil, dass, wenn, obwohl, ob …) → Nebensätze immer abtrennen.</li>
                <li><b>Relativwörter</b> (der/die/das …) → Relativsätze immer abtrennen.</li>
                <li><b>Aufzählung</b> A, B und C → kein Beistrich vor „und“.</li>
                <li><b>Infinitiv</b> um/ohne/(an)statt/außer/als … zu → Beistrich.</li>
                <li><b>Einschub</b> → zwei Beistriche.</li>
                <li><b>Wörtliche Rede</b> → „…!“, sagte …</li>
                {level === "ahs" ? (
                  <li><b>Zweifelsfälle</b>: „und“ zwischen zwei Hauptsätzen oder kurzer Infinitiv → Komma oft möglich (Lesbarkeit).</li>
                ) : (
                  <li><b>Standard</b>: Zweifelsfälle weglassen – Pflichtfälle sauber setzen.</li>
                )}
              </ol>
            </div>

            <div className="bg-red-50 rounded-2xl p-6 sm:p-8 shadow-sm ring-1 ring-red-100">
              <h3 className="text-lg font-bold text-red-900 mb-4">Merksatz - Komma vor "und"</h3>
              <div className="text-sm text-red-900 space-y-3">
                <p><b>Aufzählung:</b> kein Beistrich vor <span className="mono bg-white px-1.5 py-0.5 rounded ring-1 ring-red-200">und</span>.</p>
                <p><b>Zwei Hauptsätze:</b> Komma oft <i>möglich</i> (Lesbarkeit), nicht immer Pflicht.</p>
                <p><b>Nebensatz endet:</b> Komma steht trotzdem vor <span className="mono bg-white px-1.5 py-0.5 rounded ring-1 ring-red-200">und</span>.</p>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-6 shadow-sm ring-1 ring-slate-200">
              <h3 className="text-base font-bold text-slate-900 mb-3">Empfohlenes Vorgehen</h3>
              <ol className="list-decimal pl-5 text-sm text-slate-600 space-y-2">
                <li><b>Lernen</b>: Nebensatz & Relativsatz zuerst.</li>
                <li><b>Üben</b>: Nebensätze → Relativsätze → Aufzählungen.</li>
                <li>Dann Infinitivgruppen + Einschübe.</li>
                <li><b>Gemischt</b> → <b>Test</b>.</li>
              </ol>
            </div>
          </div>
        </div>
      );
    }

    // 2. Regel-Detailansicht (Handout-Style)
    function ScreenTopic({ rule, onBack, onStartPractice }) {
      return (
        <div className="fade-in max-w-3xl mx-auto">
          <button onClick={onBack} className="mb-6 flex items-center text-sm font-medium text-slate-500 hover:text-slate-800 transition">
            <svg className="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg> Zurück zur Übersicht
          </button>

          <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm ring-1 ring-slate-200 mb-6">
            <div className="flex items-center gap-3 mb-4">
               <h2 className="text-2xl font-bold text-slate-900">{rule.title}</h2>
            </div>

            <p className="text-lg text-slate-700 mb-8">{rule.why}</p>

            <div className="grid sm:grid-cols-2 gap-6">
              <div>
                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Signalwörter achten auf:</h4>
                <div className="flex flex-wrap gap-2">
                  {rule.signals.map((s, i) => <span key={i} className="bg-slate-100 text-slate-700 px-3 py-1 rounded-md text-sm">{s}</span>)}
                </div>
              </div>
              <div>
                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Beispiele:</h4>
                <ul className="space-y-2">
                  {rule.examples.map((e, i) => (
                    <li key={i} className="bg-slate-50 px-3 py-2 rounded-lg text-sm text-slate-800 border-l-2 border-red-500">{e}</li>
                  ))}
                </ul>
              </div>
            </div>

            {rule.notes?.length > 0 && (
              <div className="mt-8 bg-yellow-50/50 rounded-xl p-4 ring-1 ring-yellow-200">
                <h4 className="text-xs font-bold text-yellow-800 uppercase tracking-wider mb-2">Tipp vom Lehrer:</h4>
                <ul className="list-disc pl-5 text-sm text-yellow-900 space-y-1">
                  {rule.notes.map((n, i) => <li key={i}>{n}</li>)}
                </ul>
              </div>
            )}
          </div>

          <div className="flex justify-center mt-8">
            <Button onClick={() => onStartPractice(RULE_TO_CAT[rule.key])} className="w-full sm:w-auto px-8 py-4 text-lg">
              Jetzt „{rule.title}“ üben
            </Button>
          </div>
        </div>
      );
    }

    // 3. Praxis-Session (Zen-Modus, mit Tracking der Levels und Test/Practice Modus)
    function ScreenPractice({ level, category, mode, onFinish, onAbort }) {
      const isTest = mode === "test";
      const count = isTest ? 10 : 12;
      const [queue] = useState(() => pickExercises({ level, cat: category, count }));
      const [idx, setIdx] = useState(0);

      const [userPos, setUserPos] = useState([]);
      const [choicePick, setChoicePick] = useState(null);

      const [checked, setChecked] = useState(false);
      const [showSol, setShowSol] = useState(false);

      const statsKey = `beistriche_stats_${level}_${mode}`;
      const [stats, setStats] = useStoredState(statsKey, { answered:0, correct:0, streak:0, best:0 });

      // Lokaler Score nur für diese Runde
      const [roundScore, setRoundScore] = useState(0);

      const item = queue[idx];
      const isDone = idx >= queue.length;

      const [seconds, setSeconds] = useState(0);
      useEffect(() => {
        if (!isTest || isDone) return;
        const t = setInterval(() => setSeconds(s => s + 1), 1000);
        return () => clearInterval(t);
      }, [isTest, isDone]);

      if (!item && !isDone) return <div className="text-center mt-20">Lade Aufgaben...</div>;

      if (isDone) {
        const rate = Math.round((roundScore / queue.length) * 100);
        return (
          <div className="fade-in max-w-xl mx-auto text-center mt-12">
            <div className="bg-white rounded-3xl p-8 sm:p-12 shadow-sm ring-1 ring-slate-200">
              <div className="text-4xl mb-4">{rate >= 80 ? "🎉" : "📚"}</div>
              <h2 className="text-2xl font-bold text-slate-900 mb-2">{isTest ? "Test beendet!" : "Runde beendet!"}</h2>
              <p className="text-slate-600 mb-6">Du hast {roundScore} von {queue.length} Aufgaben richtig gelöst.</p>
              {isTest && (
                <div className="bg-slate-50 inline-block px-4 py-2 rounded-lg text-slate-600 mb-8 font-mono text-sm ring-1 ring-slate-200">
                  Benötigte Zeit: {Math.floor(seconds/60)}:{String(seconds%60).padStart(2,"0")}
                </div>
              )}
              <Button onClick={onFinish} className="w-full">Zurück zur Übersicht</Button>
            </div>
          </div>
        );
      }

      function gradeNow() {
        if(!item) return false;
        if(item.mode === "choice") return choicePick === item.correctIndex;
        return isCorrect(userPos, item.solutions);
      }

      function handleCheck() {
        if(checked) {
          setIdx(i => i + 1);
          setChecked(false);
          setShowSol(false);
          setChoicePick(null);
          setUserPos(item.mode === "detective" ? normalizePositions(queue[idx+1]?.initial || []) : []);
        } else {
          const ok = gradeNow();
          if(ok) setRoundScore(s => s + 1);

          setStats(s => {
            const answered = s.answered + 1;
            const correct = s.correct + (ok ? 1 : 0);
            const streak = ok ? (s.streak + 1) : 0;
            const best = Math.max(s.best, streak);
            return { answered, correct, streak, best };
          });

          setChecked(true);
        }
      }

      let isAnsCorrect = null;
      if (checked) isAnsCorrect = gradeNow();

      const solutionForDisplay = bestSolutionForDisplay(userPos, item.solutions);

      return (
        <div className="fade-in max-w-4xl mx-auto flex flex-col min-h-[60vh]">
          <div className="flex justify-between items-center mb-8 text-sm font-medium text-slate-400">
            <button onClick={onAbort} className="hover:text-slate-800 transition">Abbrechen</button>
            <div className="flex gap-1">
               {queue.map((_, i) => (
                 <div key={i} className={`w-2 h-2 rounded-full ${i === idx ? "bg-red-500" : i < idx ? "bg-slate-300" : "bg-slate-200"}`} />
               ))}
            </div>
            {isTest ? (
              <span className="font-mono">{Math.floor(seconds/60)}:{String(seconds%60).padStart(2,"0")}</span>
            ) : (
              <span>Aufgabe {idx + 1}/{queue.length}</span>
            )}
          </div>

          <div className="flex-grow flex flex-col justify-center items-center w-full">
             <div className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-6 text-center">
                {item.prompt}
             </div>

             {item.mode === "choice" ? (
               <div className="w-full max-w-lg grid gap-3">
                 {item.options.map((opt, i) => {
                    const picked = choicePick === i;
                    const correct = checked && i === item.correctIndex;
                    const wrongPicked = checked && picked && i !== item.correctIndex;
                    return (
                      <button
                        key={i}
                        onClick={() => !checked && setChoicePick(i)}
                        className={[
                          "text-left rounded-xl px-5 py-4 ring-1 transition-all",
                          picked && !checked ? "bg-red-50 ring-2 ring-red-500 shadow-sm" : "bg-white ring-slate-200 hover:bg-slate-50",
                          correct ? "ring-2 ring-emerald-500 bg-emerald-50" : "",
                          wrongPicked ? "ring-2 ring-rose-500 bg-rose-50" : ""
                        ].join(" ")}
                      >
                        <div className="text-base text-slate-800 mono">{opt}</div>
                      </button>
                    );
                 })}
               </div>
             ) : (
               <CommaEditor
                 tokens={item.tokens}
                 value={userPos}
                 onChange={setUserPos}
                 readOnly={checked}
                 showSolution={showSol}
                 solutionPositions={solutionForDisplay}
               />
             )}
          </div>

          <div className="mt-12 min-h-[140px] flex flex-col items-center justify-end">
            {checked && (
              <div className={`fade-in text-center mb-6 px-4 py-3 rounded-xl w-full max-w-md ${isAnsCorrect ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800"}`}>
                 <div className="font-bold mb-1">{isAnsCorrect ? "Richtig! Gut gemacht." : "Noch nicht ganz."}</div>
                 <div className="text-sm opacity-90">{item.explain}</div>

                 {!isAnsCorrect && !showSol && !isTest && item.mode !== "choice" && (
                   <button onClick={()=>setShowSol(true)} className="mt-2 text-xs underline opacity-80 hover:opacity-100">Lösung anzeigen im Satz</button>
                 )}
              </div>
            )}

            <Button onClick={handleCheck} className="w-full sm:w-64 py-4 text-lg" disabled={!checked && item.mode === "choice" && choicePick === null}>
              {checked ? (idx === queue.length - 1 ? "Ergebnis ansehen" : "Nächste Aufgabe") : "Prüfen"}
            </Button>
          </div>
        </div>
      );
    }

    // ----------------------------
    // App Root Controller
    // ----------------------------
    function App(){
      const [level, setLevel] = useStoredState("beistriche_level", "standard");
      const [screen, setScreen] = useState("home"); // home, topic, practice, test, checklist
      const [activeRule, setActiveRule] = useState(null);
      const [practiceCat, setPracticeCat] = useState("Gemischt");

      if (screen === "home") {
        return <ScreenHome
          level={level}
          setLevel={setLevel}
          onOpenTopic={(rule) => { setActiveRule(rule); setScreen("topic"); }}
          onStartMixed={() => { setPracticeCat("Gemischt"); setScreen("practice"); }}
          onStartTest={() => { setPracticeCat("Gemischt"); setScreen("test"); }}
          onOpenChecklist={() => setScreen("checklist")}
        />;
      }

      if (screen === "checklist") {
        return <ScreenChecklist level={level} onBack={() => setScreen("home")} />;
      }

      if (screen === "topic") {
        return <ScreenTopic
          rule={activeRule}
          onBack={() => setScreen("home")}
          onStartPractice={(cat) => { setPracticeCat(cat); setScreen("practice"); }}
        />;
      }

      if (screen === "practice" || screen === "test") {
        return (
          <>
            <style>{`.app-header { display: none !important; }`}</style>
            <ScreenPractice
              level={level}
              category={practiceCat}
              mode={screen}
              onFinish={() => setScreen("home")}
              onAbort={() => setScreen("home")}
            />
          </>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
</body>
</html>
