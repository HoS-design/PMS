<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Kompass</title>
    
    <!-- Standard Styles -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/app.css">

    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root { --subject-color: #a855f7; }
        body { background-color: #fdf4ff; } /* Freundliches Helllila */
        .card-btn { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        .card-btn:active { transform: scale(0.95); }
        .animate-wiggle { animation: wiggle 3s ease-in-out infinite; }
        .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="brand-row">
            <img src="/chatisthisreal.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-title">
                <div class="badge-main">Digitale Grundbildung</div>
                <h1>Mein Kompass</h1>
            </div>
        </div>
        <div class="header-actions">
            <a href="/index.html" class="header-link">Startseite</a>
        </div>
    </header>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { render } = ReactDOM;

        // --- DATENBANK DER AUFGABEN ---
        const LEVELS = [
            {
                id: 'explorer',
                title: 'Entdecker',
                color: 'bg-blue-500',
                ring: 'ring-blue-200',
                icon: '🔍',
                intro: 'Wir suchen Computer-Sachen! Zeig mir, was ein Gerät ist.',
                tasks: [
                    { q: "Wo ist das Tablet? 📱", ok: "📱", okImg: "Tablet", bad: "🍌", badImg: "Banane", msg: "Lecker, aber kein Computer!" },
                    { q: "Wo ist die Maus? 🖱️", ok: "🖱️", okImg: "Maus", bad: "🐱", badImg: "Katze", msg: "Miau! Das ist ein Tier!" },
                    { q: "Zeig mir das Handy! 📱", ok: "📱", okImg: "Handy", bad: "👞", badImg: "Schuh", msg: "Den zieht man an!" },
                    { q: "Wo ist der Laptop? 💻", ok: "💻", okImg: "Laptop", bad: "🍕", badImg: "Pizza", msg: "Mjam, Pizza essen!" },
                    { q: "Ich suche die Tastatur ⌨️", ok: "⌨️", okImg: "Tastatur", bad: "🎹", badImg: "Klavier", msg: "Das macht Musik!" },
                    { q: "Wo ist der Drucker? 🖨️", ok: "🖨️", okImg: "Drucker", bad: "🍞", badImg: "Toaster", msg: "Das ist für Toastbrot!" },
                    { q: "Zeig mir den Controller 🎮", ok: "🎮", okImg: "Spiel", bad: "🚗", badImg: "Auto", msg: "Brumm Brumm!" },
                    { q: "Wo ist die Kamera? 📸", ok: "📸", okImg: "Foto", bad: "🌻", badImg: "Blume", msg: "Eine schöne Blume!" },
                    { q: "Was ist ein Roboter? 🤖", ok: "🤖", okImg: "Robo", bad: "🧸", badImg: "Teddy", msg: "Kuschelig, aber kein Roboter!" },
                    { q: "Wo ist die Uhr? ⌚", ok: "⌚", okImg: "Uhr", bad: "🍩", badImg: "Donut", msg: "Süß!" },
                    { q: "Wo ist das Kabel? 🔌", ok: "🔌", okImg: "Stecker", bad: "🐍", badImg: "Schlange", msg: "Huch, eine Schlange!" },
                    { q: "Zeig mir den Bildschirm 🖥️", ok: "🖥️", okImg: "Monitor", bad: "🖼️", badImg: "Bild", msg: "Das hängt an der Wand." }
                ]
            },
            {
                id: 'thinker',
                title: 'Denker',
                color: 'bg-purple-500',
                ring: 'ring-purple-200',
                icon: '🧠',
                intro: 'Was brauchst du wofür? Überlege gut!',
                tasks: [
                    { q: "Ich möchte Musik hören 🎵", ok: "🎧", okImg: "Kopfhörer", bad: "👓", badImg: "Brille", msg: "Damit sieht man besser." },
                    { q: "Akku ist leer! Aufladen! ⚡", ok: "🔋", okImg: "Batterie", bad: "🍔", badImg: "Burger", msg: "Burger kann man nicht laden!" },
                    { q: "Ich will ein Foto machen 📸", ok: "📸", okImg: "Kamera", bad: "👁️", badImg: "Auge", msg: "Nur gucken, kein Foto." },
                    { q: "Ich will einen Brief schreiben ✍️", ok: "⌨️", okImg: "Tastatur", bad: "⚽", badImg: "Ball", msg: "Damit spielt man Fußball." },
                    { q: "Ich will klicken! 👆", ok: "🖱️", okImg: "Maus", bad: "🥄", badImg: "Löffel", msg: "Damit isst man Suppe." },
                    { q: "Lass uns spielen! 🎲", ok: "🎮", okImg: "Gamepad", bad: "📚", badImg: "Buch", msg: "Lesen ist toll, aber kein Game." },
                    { q: "Wie spät ist es? 🕒", ok: "⌚", okImg: "Uhr", bad: "🧭", badImg: "Kompass", msg: "Das zeigt Norden an." },
                    { q: "Ich will drucken 📄", ok: "🖨️", okImg: "Drucker", bad: "📺", badImg: "TV", msg: "Das ist zum Fernsehen." },
                    { q: "Ins Internet gehen 🌐", ok: "📱", okImg: "Tablet", bad: "🚲", badImg: "Fahrrad", msg: "Damit fährt man draußen." },
                    { q: "Film schauen 🎬", ok: "💻", okImg: "Laptop", bad: "📻", badImg: "Radio", msg: "Radio ist nur für Ohren." }
                ]
            },
            {
                id: 'guardian',
                title: 'Wächter',
                color: 'bg-red-500',
                ring: 'ring-red-200',
                icon: '🛡️',
                intro: 'Aufpassen! Was ist gefährlich? Was ist sicher?',
                tasks: [
                    { q: "Ein Fremder schreibt dich an! 🛑", ok: "🛑", okImg: "STOP & Mama rufen", bad: "👋", badImg: "Hallo sagen", msg: "Nein! Nicht antworten!" },
                    { q: "Komisches Bild am Screen? 👾", ok: "🛑", okImg: "STOP & Papa rufen", bad: "👍", badImg: "Anklicken", msg: "Nein! Das kann ein Virus sein." },
                    { q: "Tablet ist kaputt gegangen 💔", ok: "🗣️", okImg: "Bescheid sagen", bad: "🤫", badImg: "Verstecken", msg: "Ehrlich sein ist besser!" },
                    { q: "Darf ich alles anklicken? 🤔", ok: "🛑", okImg: "Nein, fragen!", bad: "✅", badImg: "Ja klar", msg: "Lieber erst fragen!" },
                    { q: "Wie lange spielen? ⏳", ok: "⏱️", okImg: "Mit Wecker", bad: "🌙", badImg: "Ganze Nacht", msg: "Das ist zu viel!" },
                    { q: "Wer darf mein Passwort wissen? 🔑", ok: "👩‍🦰", okImg: "Mama/Papa", bad: "🤡", badImg: "Fremde", msg: "Geheim bleiben!" }
                ]
            }
        ];

        // --- KOMPONENTEN ---

        const Card = ({ emoji, label, onClick, color = "white", shake }) => (
            <button 
                onClick={onClick} 
                className={`
                    relative flex flex-col items-center justify-center 
                    p-6 sm:p-10 rounded-[2.5rem] 
                    border-b-8 transition-all duration-200 
                    ${shake ? 'animate-shake bg-red-50 border-red-300' : 'bg-white border-slate-200 hover:bg-slate-50 hover:-translate-y-2 active:translate-y-0'}
                    shadow-xl w-full h-full min-h-[220px]
                `}
            >
                <div className="text-7xl sm:text-9xl mb-4 filter drop-shadow-sm select-none">{emoji}</div>
                {label && <div className="text-xl sm:text-2xl font-bold text-slate-700">{label}</div>}
            </button>
        );

        const FeedbackOverlay = ({ show }) => {
            if (!show) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/20 backdrop-blur-sm animate-in fade-in zoom-in duration-300">
                    <div className="text-9xl animate-bounce drop-shadow-2xl">⭐</div>
                </div>
            );
        };

        const App = () => {
            // State
            const [mode, setMode] = useState('menu'); // 'menu', 'game', 'finish'
            const [activeLevel, setActiveLevel] = useState(null);
            const [taskIndex, setTaskIndex] = useState(0);
            const [shaking, setShaking] = useState(null); // 'left' or 'right'
            const [showStar, setShowStar] = useState(false);

            // Helpers
            const startLevel = (levelId) => {
                setActiveLevel(LEVELS.find(l => l.id === levelId));
                setTaskIndex(0);
                setMode('game');
            };

            const handleAnswer = (isCorrect, side) => {
                if (isCorrect) {
                    // Richtig!
                    setShowStar(true);
                    const audio = new Audio('/sounds/success.mp3'); // Optional, falls vorhanden
                    
                    setTimeout(() => {
                        setShowStar(false);
                        if (taskIndex + 1 < activeLevel.tasks.length) {
                            setTaskIndex(t => t + 1);
                        } else {
                            setMode('finish');
                        }
                    }, 1200); // Zeit für den Stern
                } else {
                    // Falsch -> Wackeln
                    setShaking(side);
                    setTimeout(() => setShaking(null), 500);
                    
                    // Optional: Kleiner Hinweis via Alert oder Toast, hier einfach visuell
                }
            };

            // --- VIEWS ---

            // 1. HAUPTMENÜ
            if (mode === 'menu') {
                return (
                    <div className="flex flex-col items-center p-6 max-w-5xl mx-auto min-h-[85vh]">
                        <div className="text-center mb-10 mt-4">
                            <h1 className="text-4xl sm:text-6xl font-extrabold text-purple-600 mb-4 animate-wiggle">Hallo! 👋</h1>
                            <p className="text-xl sm:text-3xl text-slate-600 font-medium">Was möchtest du heute üben?</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                            {LEVELS.map(level => (
                                <button 
                                    key={level.id}
                                    onClick={() => startLevel(level.id)}
                                    className={`
                                        relative flex flex-col items-center p-8 rounded-[2rem] 
                                        border-b-8 transition-transform hover:-translate-y-2 active:scale-95
                                        ${level.color} border-black/20 shadow-xl group
                                    `}
                                >
                                    <div className="text-8xl mb-6 bg-white/20 p-6 rounded-full backdrop-blur-sm group-hover:scale-110 transition-transform">
                                        {level.icon}
                                    </div>
                                    <h2 className="text-3xl font-black text-white tracking-wide">{level.title}</h2>
                                    <div className="mt-4 bg-white/20 px-4 py-1 rounded-full text-white font-bold text-sm">
                                        {level.tasks.length} Aufgaben
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            // 2. SPIEL / GAMEPLAY
            if (mode === 'game' && activeLevel) {
                const task = activeLevel.tasks[taskIndex];
                // Zufällige Anordnung der Karten für Abwechslung
                // Wir nutzen den taskIndex als Seed für "Pseudo-Random", damit es stabil bleibt beim Re-Render, 
                // aber wir machen es einfach: Random bei jedem Task-Wechsel. 
                // Hier hardcoded wir einfach: Mal links, mal rechts basierend auf Index (gerade/ungerade)
                // damit es nicht zu verwirrend wird, aber nicht immer gleich ist.
                const swap = taskIndex % 2 !== 0; 

                return (
                    <div className="flex flex-col items-center p-4 max-w-6xl mx-auto min-h-[85vh]">
                        <FeedbackOverlay show={showStar} />

                        {/* Progress Bar */}
                        <div className="w-full h-4 bg-slate-200 rounded-full mb-6 overflow-hidden">
                            <div 
                                className={`h-full ${activeLevel.color} transition-all duration-500`} 
                                style={{ width: `${((taskIndex) / activeLevel.tasks.length) * 100}%` }}
                            />
                        </div>

                        <h2 className="text-2xl sm:text-4xl font-bold text-slate-800 text-center mb-10 leading-snug">
                            {task.q}
                        </h2>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-12 w-full flex-grow items-center">
                            {/* Karte 1 */}
                            <Card 
                                emoji={swap ? task.bad : task.ok} 
                                label={swap ? task.badImg : task.okImg}
                                shake={shaking === 'left'}
                                onClick={() => handleAnswer(swap ? false : true, 'left')}
                            />
                            
                            {/* Karte 2 */}
                            <Card 
                                emoji={swap ? task.ok : task.bad} 
                                label={swap ? task.okImg : task.badImg}
                                shake={shaking === 'right'}
                                onClick={() => handleAnswer(swap ? true : false, 'right')}
                            />
                        </div>

                        <button onClick={() => setMode('menu')} className="mt-8 text-slate-400 font-bold hover:text-slate-600 uppercase tracking-widest text-sm">
                            Abbrechen / Zurück
                        </button>
                    </div>
                );
            }

            // 3. ZIEL / FINISH
            if (mode === 'finish') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-[80vh] p-6 text-center animate-in fade-in duration-700">
                        <div className="text-9xl mb-8 animate-bounce">🎉</div>
                        <h1 className="text-5xl sm:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-6">
                            Klasse gemacht!
                        </h1>
                        <p className="text-2xl text-slate-600 mb-12 max-w-md">
                            Du hast alle Aufgaben im Bereich <strong>{activeLevel.title}</strong> geschafft.
                        </p>
                        
                        <div className="flex gap-4">
                            <button 
                                onClick={() => setMode('menu')} 
                                className="bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-6 px-12 rounded-full shadow-xl border-b-8 border-blue-700 active:translate-y-1 active:border-b-0 transition-all"
                            >
                                Zurück zur Übersicht 🏠
                            </button>
                        </div>
                    </div>
                );
            }
            
            return null; // Fallback
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
