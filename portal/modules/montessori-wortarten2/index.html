<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Montessori – Wortarten-Symbole zuordnen</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/app-layout.css">
  <style>
    :root {
      /* Montessori-Farben */
      --noun: #111827;     /* Nomen: schwarz */
      --article: #93c5fd;  /* Artikel: hellblau */
      --adj: #2563eb;      /* Adjektiv: blau */
      --verb: #ef4444;     /* Verb: rot */
      --pron: #7c3aed;     /* Pronomen: lila */
      --prep: #22c55e;     /* Präposition: grün */
      --conj: #ec4899;     /* Konjunktion: rosa */
      --interj: #fbbf24;   /* Interjektion: gold */
    }

    .hos-stage { grid-template-columns: minmax(0, 1fr) 380px; }

    /* Satzbereich */
    .sentence-panel { display: flex; flex-direction: column; gap: 10px; }
    .how { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .how .hos-pill.now { background: var(--subject-soft); border-color: var(--subject-line); color: var(--subject-strong); }
    .sentence {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      align-items: flex-end;
      gap: 16px 10px;
      padding: 18px;
      border: 2px dashed var(--hos-line);
      border-radius: 14px;
      background: #fafaf9;
      overflow: auto;
    }
    .tok { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .tok.word {
      background: #fff;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 6px 6px 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
      cursor: pointer;
    }
    .tok.word:hover { border-color: var(--hos-line); }
    .tok.word.selected { border-color: var(--subject); background: var(--subject-soft); }
    .tok .w { font-size: 26px; font-weight: 700; padding: 2px 8px; user-select: none; }
    .tok.punct .w { font-size: 26px; font-weight: 700; padding-bottom: 72px; }
    .slot {
      width: 62px; height: 58px;
      border-radius: 10px;
      border: 2px solid var(--hos-line);
      background: #fff;
      display: grid; place-items: center;
      position: relative;
    }
    .slot svg { width: 40px; height: 40px; display: block; }
    .slot.ok { border-color: #16a34a; background: #f0fdf4; }
    .slot.bad { border-color: #dc2626; background: #fef2f2; }
    .slot.drop { border-color: var(--subject); background: var(--subject-soft); }
    .slot .clear {
      position: absolute; right: -9px; top: -9px;
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid var(--hos-line); background: #fff; color: var(--hos-muted);
      display: grid; place-items: center; font-weight: 800; font-size: 13px; line-height: 1;
      cursor: pointer; opacity: 0; padding: 0;
    }
    .tok.word:hover .clear, .tok.word.selected .clear, .slot .clear:focus { opacity: 1; }
    .tok.given { cursor: default; }
    .tok.given .w { opacity: .45; }
    .tok.given .slot { opacity: .6; }

    /* Symbol-Palette */
    .symbols-panel { display: flex; flex-direction: column; gap: 8px; }
    .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sym {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 2px solid var(--hos-line);
      background: #fff;
      cursor: pointer;
      text-align: left;
      position: relative;
      user-select: none;
    }
    .sym:hover { border-color: #d6d3d1; }
    .sym.selected { border-color: var(--subject); background: var(--subject-soft); }
    .sym svg { width: 36px; height: 36px; display: block; }
    .sym .label { font-weight: 800; font-size: .92rem; display: block; white-space: nowrap; }
    .sym .hint { font-size: .78rem; color: var(--hos-muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sym .hos-kbd { position: absolute; top: 3px; left: 4px; font-size: .68rem; padding: 0 4px; }
    .palette-note { font-size: .82rem; color: var(--hos-muted); line-height: 1.4; margin-top: auto; }

    .counter { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; }
  </style>
</head>
<body class="hos-app subject-deutsch">

<header class="app-header">
  <div class="brand-row">
    <img src="/chatisthisreal.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
    <div class="brand-title">
      <div class="badge-main is-deutsch">Deutsch</div>
      <h1>Montessori Wortarten</h1>
    </div>
  </div>
  <div class="header-actions">
    <a href="/index.html" class="header-link">Startseite</a>
  </div>
</header>

<main class="hos-main">
  <div class="hos-topbar">
    <span class="counter">Satz <span id="idx">1</span> von <span id="total">30</span></span>
    <div class="hos-progress" style="width: 220px" title="Erledigte Sätze"><span id="progressBar"></span></div>
    <span class="hos-pill">Erledigt: <b id="done">0</b></span>
    <span class="hos-spacer"></span>
    <span class="hos-label">Niveau:</span>
    <div class="hos-seg" role="group" aria-label="Niveau">
      <button type="button" id="modeBasis" title="Nur Nomen, Artikel, Verb und Adjektiv">Basis (4)</button>
      <button type="button" id="modeProfi" title="Alle 8 Wortarten">Profi (8)</button>
    </div>
  </div>

  <div class="hos-stage">
    <section class="hos-panel sentence-panel" aria-label="Satz">
      <div class="how">
        <span class="hos-pill" id="howSym"><b>1</b> Symbol wählen</span>
        <span aria-hidden="true">→</span>
        <span class="hos-pill" id="howWord"><b>2</b> Wort antippen</span>
        <span class="hos-muted" id="instruction"></span>
      </div>
      <div id="sentence" class="sentence" aria-label="Satzbereich"></div>
    </section>

    <aside class="hos-panel symbols-panel" aria-label="Symbole">
      <h2 class="hos-panel-title">Symbole</h2>
      <div class="palette" id="palette"></div>
      <div class="palette-note" id="paletteNote"></div>
    </aside>
  </div>

  <div class="hos-bottombar">
    <button type="button" class="hos-btn soft" id="prevBtn" title="Vorheriger Satz (Pfeil links)">← Zurück</button>
    <div class="hos-feedback" id="msg" aria-live="polite">Wähle ein Symbol und tippe dann auf ein Wort.</div>
    <button type="button" class="hos-btn soft" id="newBtn" title="Diesen Satz zurücksetzen">↺ Neu</button>
    <button type="button" class="hos-btn soft" id="solveBtn">Lösung zeigen</button>
    <button type="button" class="hos-btn primary" id="checkBtn">Prüfen</button>
    <button type="button" class="hos-btn" id="nextBtn" title="Nächster Satz (Pfeil rechts)">Weiter →</button>
  </div>
</main>

<script>
/* =========================================================
   Montessori-Symbole (SVG)
   HoS-Farben via CSS Var
========================================================= */
const SYMBOLS = [
  { key:"N",    name:"Nomen",        hint:"Dinge/Namen",        colorVar:"--noun",    draw:"triangle" },
  { key:"ART",  name:"Artikel",      hint:"Begleiter",          colorVar:"--article", draw:"triangleSmall" },
  { key:"ADJ",  name:"Adjektiv",     hint:"Wie ist es?",        colorVar:"--adj",     draw:"triangleMid" },
  { key:"V",    name:"Verb",         hint:"Tun-Wort",           colorVar:"--verb",    draw:"circle" },
  { key:"PRO",  name:"Pronomen",     hint:"Für-Wort",           colorVar:"--pron",    draw:"trianglePron" },
  { key:"PRÄP", name:"Präposition",  hint:"Lage/Verhältnis",    colorVar:"--prep",    draw:"crescent" },
  { key:"KONJ", name:"Konjunktion",  hint:"Bindewort",          colorVar:"--conj",    draw:"bar" },
  { key:"INT",  name:"Interjektion", hint:"Ausruf",             colorVar:"--interj",  draw:"marker" }
];

function svgFor(sym, size=34){
  const color = getComputedStyle(document.documentElement).getPropertyValue(sym.colorVar).trim();
  const view = `0 0 100 100`;

  const tri = (scale=1, yOffset=0, widthScale=1.0) => {
    const cx=50, cy=52+yOffset;
    const w=70*scale*widthScale, h=64*scale;
    return `<polygon points="${cx},${cy-h/2} ${cx-w/2},${cy+h/2} ${cx+w/2},${cy+h/2}" fill="${color}" />`;
  };

  const circle = (r=34) => `<circle cx="50" cy="52" r="${r}" fill="${color}" />`;

  const crescent = () => `
    <g transform="rotate(90 50 50)">
      <path d="M63 20 A30 30 0 1 0 63 84 A22 30 0 1 1 63 20 Z" fill="${color}" />
      <path d="M71 24 A24 28 0 1 0 71 80 A18 28 0 1 1 71 24 Z" fill="white" opacity="0.9"/>
    </g>
  `;

  const bar = () => `<rect x="18" y="44" width="64" height="18" rx="9" fill="${color}" />`;

  const marker = () => `
    <g>
      <circle cx="50" cy="28" r="16" fill="${color}" />
      <path d="M34 40 L66 40 L78 86 Q50 96 22 86 Z" fill="${color}" />
    </g>
  `;

  let shape = "";
  switch(sym.draw){
    case "triangle":       shape = tri(1.0, 0); break;
    case "triangleSmall":  shape = tri(0.72, 4); break;
    case "triangleMid":    shape = tri(0.86, 2); break;
    case "trianglePron":   shape = tri(0.86, 2, 0.6); break;
    case "circle":         shape = circle(32); break;
    case "crescent":       shape = crescent(); break;
    case "bar":            shape = bar(); break;
    case "marker":         shape = marker(); break;
  }

  return `<svg width="${size}" height="${size}" viewBox="${view}">${shape}</svg>`;
}

/* =========================================================
   Übungen (30 Sätze)
========================================================= */
const EXERCISES = [
  { sentence: "Der kluge Hund läuft durch den Park.",               types:["ART","ADJ","N","V","PRÄP","ART","N"] },
  { sentence: "Wow, meine Schwester liest ein Buch.",               types:["INT","PRO","N","V","ART","N"] },
  { sentence: "Ich gehe mit dir in das Kino.",                      types:["PRO","V","PRÄP","PRO","PRÄP","ART","N"] },
  { sentence: "Der alte Mann spricht laut.",                        types:["ART","ADJ","N","V","ADJ"] },
  { sentence: "Aua! Der Tee ist heiß.",                             types:["INT","ART","N","V","ADJ"] },
  { sentence: "Wir bleiben zu Hause.",                              types:["PRO","V","PRÄP","N"] },
  { sentence: "Die Kinder spielen fröhlich.",                       types:["ART","N","V","ADJ"] },
  { sentence: "Er hat auf den Bus gewartet.",                       types:["PRO","V","PRÄP","ART","N","V"] },
  { sentence: "Oh, ich lache laut.",                                types:["INT","PRO","V","ADJ"] },
  { sentence: "Der Ball liegt auf dem Tisch.",                      types:["ART","N","V","PRÄP","ART","N"] },
  { sentence: "Sie arbeitet konzentriert.",                         types:["PRO","V","ADJ"] },
  { sentence: "Wow, der Film war spannend.",                        types:["INT","ART","N","V","ADJ"] },
  { sentence: "Ich bleibe.",                                        types:["PRO","V"] },
  { sentence: "Der Hund schläft ruhig.",                            types:["ART","N","V","ADJ"] },
  { sentence: "Ach, das ist kein Problem.",                         types:["INT","PRO","V","ART","N"] },
  { sentence: "Die kleine Katze springt auf das Sofa.",             types:["ART","ADJ","N","V","PRÄP","ART","N"] },
  { sentence: "Er liest aufmerksam.",                               types:["PRO","V","ADJ"] },
  { sentence: "Meine Freunde warten geduldig.",                     types:["PRO","N","V","ADJ"] },
  { sentence: "Oh, das klingt gut.",                                types:["INT","PRO","V","ADJ"] },
  { sentence: "Der lange Zug fährt schnell.",                       types:["ART","ADJ","N","V","ADJ"] },
  { sentence: "Sie bleibt in der Klasse.",                          types:["PRO","V","PRÄP","ART","N"] },
  { sentence: "Wow, ich habe gefroren.",                            types:["INT","PRO","V","V"] },
  { sentence: "Der Lehrer erklärt alles ruhig.",                    types:["ART","N","V","PRO","ADJ"] },
  { sentence: "Ach, wir sind fertig.",                              types:["INT","PRO","V","ADJ"] },
  { sentence: "Die Sonne scheint hell.",                            types:["ART","N","V","ADJ"] },
  { sentence: "Er spricht höflich.",                                types:["PRO","V","ADJ"] },
  { sentence: "Oh, das klappt gut.",                                types:["INT","PRO","V","ADJ"] },
  { sentence: "Mein Bruder arbeitet sorgfältig.",                   types:["PRO","N","V","ADJ"] },
  { sentence: "Wow, das war cool.",                                 types:["INT","PRO","V","ADJ"] },
  { sentence: "Die Kinder gehen nach Hause.",                       types:["ART","N","V","PRÄP","N"] }
];

/* =========================================================
   Zustand
========================================================= */
const BASIS_KEYS = ["N", "ART", "V", "ADJ"];
const PROGRESS_KEY = "hosWortartenProgress";

let current = 0;
let selectedSymbolKey = null;
let selectedWordEl = null;
let usedSolution = false;
let doneSet = new Set();
let mode = new URLSearchParams(location.search).get("level") === "basis" ? "basis" : (localStorage.getItem("hosWortartenMode") || "profi");

const $ = (id) => document.getElementById(id);
const sentenceEl = $("sentence");
const paletteEl = $("palette");

const activeSymbols = () => mode === "basis" ? SYMBOLS.filter(s => BASIS_KEYS.includes(s.key)) : SYMBOLS;
const isGiven = (type) => mode === "basis" && !BASIS_KEYS.includes(type);

$("total").textContent = EXERCISES.length;
loadProgress();

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setFeedback(text, kind) {
  const el = $("msg");
  el.className = "hos-feedback" + (kind ? " " + kind : "");
  el.textContent = text;
}

function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
    const list = data[mode];
    doneSet = new Set(Array.isArray(list) ? list.filter(n => Number.isInteger(n) && n < EXERCISES.length) : []);
  } catch (e) { doneSet = new Set(); }
}
function saveProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");
    data[mode] = Array.from(doneSet);
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  } catch (e) { /* Speicher nicht verfügbar */ }
}

function updateProgress() {
  $("progressBar").style.width = (doneSet.size / EXERCISES.length * 100) + "%";
  $("done").textContent = doneSet.size + " / " + EXERCISES.length;
  $("idx").textContent = current + 1;
}

/* =========================================================
   Niveau
========================================================= */
function setMode(m) {
  mode = m;
  localStorage.setItem("hosWortartenMode", m);
  $("modeBasis").classList.toggle("active", m === "basis");
  $("modeProfi").classList.toggle("active", m === "profi");
  $("paletteNote").innerHTML =
    "Tasten <span class=\"hos-kbd\">1–" + activeSymbols().length + "</span> wählen ein Symbol, <span class=\"hos-kbd\">Esc</span> hebt die Auswahl auf." +
    (m === "basis" ? "<br><b>Basis:</b> Nur Nomen, Artikel, Verb und Adjektiv. Die anderen Wörter sind schon gelöst." : "");
  loadProgress();
  renderPalette();
  loadExercise(current);
}

/* =========================================================
   Palette
========================================================= */
function renderPalette() {
  paletteEl.innerHTML = "";
  activeSymbols().forEach((s, idx) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "sym";
    item.draggable = true;
    item.dataset.sym = s.key;
    item.innerHTML = svgFor(s, 40) +
      "<span><span class=\"label\">" + s.name + "</span><span class=\"hint\">" + s.hint + "</span></span>" +
      "<span class=\"hos-kbd\">" + (idx + 1) + "</span>";
    item.addEventListener("dragstart", (ev) => {
      ev.dataTransfer.setData("text/plain", s.key);
      setSelectedSymbol(s.key);
    });
    item.addEventListener("click", () => {
      // Wort zuerst gewählt? Dann gleich zuordnen.
      if (selectedWordEl) {
        applySymbol(selectedWordEl, s.key);
        selectWord(null);
        return;
      }
      setSelectedSymbol(selectedSymbolKey === s.key ? null : s.key);
    });
    paletteEl.appendChild(item);
  });
}

function setSelectedSymbol(key) {
  selectedSymbolKey = key;
  document.querySelectorAll(".sym").forEach(el => el.classList.toggle("selected", el.dataset.sym === key));
  const s = SYMBOLS.find(x => x.key === key);
  $("howSym").classList.toggle("now", !s && !selectedWordEl);
  $("howWord").classList.toggle("now", !!s);
  $("instruction").innerHTML = s ? "Gewählt: <b>" + s.name + "</b>. Tippe auf alle passenden Wörter." : "";
}

function selectWord(wrap) {
  selectedWordEl = wrap;
  document.querySelectorAll(".tok.word").forEach(x => x.classList.toggle("selected", x === wrap));
  if (wrap) {
    $("howSym").classList.add("now");
    $("howWord").classList.remove("now");
    $("instruction").innerHTML = "Wort gewählt. Welches Symbol passt?";
  } else {
    setSelectedSymbol(selectedSymbolKey);
  }
}

/* =========================================================
   Satz
========================================================= */
function tokenize(str) {
  const re = /([A-Za-zÄÖÜäöüß]+(?:[-’'][A-Za-zÄÖÜäöüß]+)*)|([0-9]+)|([^\sA-Za-zÄÖÜäöüß0-9])/g;
  const out = [];
  let m;
  while ((m = re.exec(str)) !== null) {
    if (m[1] || m[2]) out.push({ kind: "word", text: m[1] || m[2] });
    else if (m[3]) out.push({ kind: "punct", text: m[3] });
  }
  return out;
}

function applySymbol(wrap, key) {
  const sym = SYMBOLS.find(s => s.key === key);
  if (!sym || wrap.classList.contains("given")) return;
  const slot = wrap.querySelector(".slot");
  slot.innerHTML = svgFor(sym, 40) + "<button type=\"button\" class=\"clear\" title=\"Symbol entfernen\" aria-label=\"Symbol entfernen\">×</button>";
  slot.classList.remove("ok", "bad");
  wrap.dataset.assigned = key;
  slot.querySelector(".clear").addEventListener("click", (e) => {
    e.stopPropagation();
    wrap.dataset.assigned = "";
    slot.innerHTML = "";
    slot.classList.remove("ok", "bad");
  });
}

function loadExercise(i) {
  current = (i + EXERCISES.length) % EXERCISES.length;
  usedSolution = false;
  updateProgress();
  selectedWordEl = null;
  setSelectedSymbol(null);
  setFeedback(doneSet.has(current) ? "Diesen Satz hast du schon gelöst. Du kannst ihn noch einmal üben." : "Wähle ein Symbol und tippe dann auf ein Wort.", "");
  $("nextBtn").classList.remove("primary");

  const ex = EXERCISES[current];
  sentenceEl.innerHTML = "";
  let wIndex = 0;

  tokenize(ex.sentence).forEach(t => {
    if (t.kind === "punct") {
      const p = document.createElement("div");
      p.className = "tok punct";
      p.innerHTML = "<div class=\"w\">" + escapeHtml(t.text) + "</div>";
      sentenceEl.appendChild(p);
      return;
    }
    const correctType = ex.types[wIndex++];
    const wrap = document.createElement("div");
    wrap.className = "tok word";
    wrap.dataset.correct = correctType;
    wrap.dataset.assigned = "";

    if (isGiven(correctType)) {
      const sym = SYMBOLS.find(s => s.key === correctType);
      wrap.classList.add("given");
      wrap.dataset.assigned = correctType;
      wrap.title = sym.name + " (schon gelöst)";
      wrap.innerHTML = "<div class=\"w\">" + escapeHtml(t.text) + "</div><div class=\"slot\">" + svgFor(sym, 40) + "</div>";
      sentenceEl.appendChild(wrap);
      return;
    }

    wrap.tabIndex = 0;
    wrap.setAttribute("role", "button");
    wrap.setAttribute("aria-label", "Wort " + t.text);
    wrap.innerHTML = "<div class=\"w\">" + escapeHtml(t.text) + "</div><div class=\"slot\"></div>";
    const slot = wrap.querySelector(".slot");

    const activate = () => {
      if (selectedSymbolKey) applySymbol(wrap, selectedSymbolKey);
      else selectWord(selectedWordEl === wrap ? null : wrap);
    };
    wrap.addEventListener("click", activate);
    wrap.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });

    slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("drop"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("drop"));
    slot.addEventListener("drop", e => {
      e.preventDefault();
      slot.classList.remove("drop");
      const k = e.dataTransfer.getData("text/plain");
      if (k) applySymbol(wrap, k);
    });

    sentenceEl.appendChild(wrap);
  });
}

/* =========================================================
   Prüfen / Lösung
========================================================= */
function check() {
  let right = 0, wrong = 0, missing = 0;
  document.querySelectorAll(".tok.word:not(.given)").forEach(w => {
    const slot = w.querySelector(".slot");
    slot.classList.remove("ok", "bad");
    if (!w.dataset.assigned) { missing++; return; }
    if (w.dataset.assigned === w.dataset.correct) { right++; slot.classList.add("ok"); }
    else { wrong++; slot.classList.add("bad"); }
  });

  if (missing === 0 && wrong === 0 && usedSolution) {
    $("nextBtn").classList.add("primary");
    setFeedback("Mit der Lösung stimmt alles. Dieser Satz zählt aber erst als erledigt, wenn du ihn selbst löst (↺ Neu).", "warn");
  } else if (missing === 0 && wrong === 0) {
    doneSet.add(current);
    saveProgress();
    updateProgress();
    $("nextBtn").classList.add("primary");
    setFeedback(doneSet.size === EXERCISES.length
      ? "Perfekt! Du hast alle " + EXERCISES.length + " Sätze gelöst."
      : "Perfekt! Alle " + right + " Wörter stimmen. Weiter zum nächsten Satz.", "good");
  } else if (wrong > 0) {
    setFeedback(right + " richtig, " + wrong + " falsch" + (missing ? ", " + missing + " fehlen noch" : "") + ". Die rot markierten Wörter noch einmal ansehen.", "bad");
  } else {
    setFeedback(right + " richtig. Bei " + missing + " Wort" + (missing === 1 ? "" : "en") + " fehlt noch ein Symbol.", "warn");
  }
}

function solve() {
  usedSolution = true;
  document.querySelectorAll(".tok.word:not(.given)").forEach(w => {
    applySymbol(w, w.dataset.correct);
    w.querySelector(".slot").classList.add("ok");
  });
  selectWord(null);
  setFeedback("Das ist die Lösung. Lies den Satz mit den Symbolen noch einmal durch und klicke dann auf „Weiter“.", "warn");
  $("nextBtn").classList.add("primary");
}

/* =========================================================
   Ereignisse
========================================================= */
$("newBtn").addEventListener("click", () => loadExercise(current));
$("prevBtn").addEventListener("click", () => loadExercise(current - 1));
$("nextBtn").addEventListener("click", () => loadExercise(current + 1));
$("checkBtn").addEventListener("click", check);
$("solveBtn").addEventListener("click", solve);
$("modeBasis").addEventListener("click", () => setMode("basis"));
$("modeProfi").addEventListener("click", () => setMode("profi"));

window.addEventListener("keydown", e => {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "Escape") { selectWord(null); setSelectedSymbol(null); }
  const n = parseInt(e.key, 10);
  const syms = activeSymbols();
  if (!isNaN(n) && n >= 1 && n <= syms.length) {
    if (selectedWordEl) { applySymbol(selectedWordEl, syms[n - 1].key); selectWord(null); }
    else setSelectedSymbol(syms[n - 1].key);
  }
  if (e.key === "ArrowRight") loadExercise(current + 1);
  if (e.key === "ArrowLeft") loadExercise(current - 1);
});

setMode(mode);
</script>
</body>
</html>
