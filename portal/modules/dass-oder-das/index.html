          detectiveTexts: [
            {
              id: "d1",
              title: "Detektivbericht",
              storyParts: [
                "Ich weiß, ", { id: "t1", val: "das", correct: "dass" }, " du heute früh da warst. ",
                "Das Problem ist ", { id: "t2", val: "dass", correct: "das" }, " Handy, ",
                { id: "t3", val: "das", correct: "das" }, " auf dem Tisch lag. ",
                "Niemand glaubt, ", { id: "t4", val: "das", correct: "dass" }, " es einfach verschwunden ist. ",
                "Ich hoffe, ", { id: "t5", val: "das", correct: "dass" }, " wir ",
                { id: "t6", val: "dass", correct: "das" }, " noch finden."
              ],
              hint: "Klicke die markierten Wörter an, um sie zu ändern (das ↔ dass)."
            },
            {
              id: "d2",
              title: "WhatsApp-Chat",
              storyParts: [
                "A: Ich glaube, ", { id: "t1", val: "das", correct: "dass" }, " du recht hast.\n",
                "B: Meinst du ", { id: "t2", val: "dass", correct: "das" }, " ernst?\n",
                "A: Ja. ", { id: "t3", val: "dass", correct: "Das" }, " ist genau ",
                { id: "t4", val: "dass", correct: "das" }, ", was ich sagen wollte.\n",
                "B: Ok, dann hoffe ich, ", { id: "t5", val: "das", correct: "dass" }, " wir das morgen klären."
              ],
              hint: "Klicke auf die Wörter. Groß-/Kleinschreibung ist hier zweitrangig."
            }
          ],
          dialogSets: [
            {
              id: "g1",
              title: "Mini-Dialog: Schule",
              lines: [
                { id: "l1", text: "Lea: Ich habe gehört, ___ du morgen einen Test schreibst.", correct: "dass" },
                { id: "l2", text: "Tom: Ja, und ___ Thema ist echt viel.", correct: "das" },
                { id: "l3", text: "Lea: Gut ist, ___ du die Ersetzprobe kennst.", correct: "dass" },
                { id: "l4", text: "Tom: Genau. ___ hilft mir richtig.", correct: "das" }
              ]
            },
            {
              id: "g2",
              title: "Mini-Dialog: Freizeit",
              lines: [
                { id: "l1", text: "Mia: Ich finde, ___ du zu streng mit dir bist.", correct: "dass" },
                { id: "l2", text: "Noah: Kann sein. ___ nervt mich.", correct: "das" },
                { id: "l3", text: "Mia: Denk dran, ___ Fehler zum Lernen gehören.", correct: "dass" },
                { id: "l4", text: "Noah: ___ ist ein guter Satz.", correct: "das" }
              ]
            }
          ]
        };

        /* -------------------------------------------------------------------------- */
        /* SUB-COMPONENTS                                                             */
        /* -------------------------------------------------------------------------- */
        const renderTextWithBlank = (text, blankValue, status) => {
          const parts = text.split("___");
          return (
            <span>
              {parts[0]}
              <span className={`inline-block mx-1 px-3 py-0.5 rounded font-bold border-b-2 transition-colors ${
                status === 'correct' ? 'bg-green-100 border-green-500 text-green-800' :
                status === 'wrong' ? 'bg-red-100 border-red-500 text-red-800' :
                'bg-red-50 border-red-300 text-red-800'
              }`}>
                {blankValue || "___"}
              </span>
              {parts[1]}
            </span>
          );
        };

        /* -------------------------------------------------------------------------- */
        /* MODULE: LEARN                                                              */
        /* -------------------------------------------------------------------------- */
        const LearnModule = ({ data, onComplete, onRecord }) => {
          const [step, setStep] = useState(0);
          const [feedback, setFeedback] = useState(null);

          const lesson = data[step];

          const handleAnswer = (userVal, correctVal, reason) => {
            const isCorrect = userVal === correctVal;
            setFeedback({ isCorrect, correctVal, reason });
            onRecord(isCorrect);
          };

          const nextStep = () => {
            setFeedback(null);
            if (step < data.length - 1) setStep(step + 1);
            else onComplete();
          };

          return (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 fade-in">
              <div className="flex justify-between items-center mb-6">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Lektion {step + 1} von {data.length}</span>
                <h2 className="text-xl font-bold text-slate-800">{lesson.title}</h2>
              </div>

              <div className="space-y-6 mb-8">
                {lesson.body.map((block, i) => (
                  <div key={i}>
                    {block.type === 'text' && <p className="text-slate-700 leading-relaxed">{block.content}</p>}
                    {block.type === 'rule' && (
                      <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r text-red-900 font-medium">
                        {block.content}
                      </div>
                    )}
                    {block.type === 'box' && (
                      <div className="bg-slate-50 border border-slate-200 p-4 rounded-lg">
                        <h4 className="font-bold text-slate-800 mb-1">{block.title}</h4>
                        <p className="text-slate-600 text-sm">{block.content}</p>
                      </div>
                    )}
                    {block.type === 'example' && (
                      <div className="font-mono text-sm bg-slate-100 p-3 rounded text-slate-600">
                        {block.content}
                      </div>
                    )}
                    {block.type === 'list' && (
                      <ul className="list-disc list-inside space-y-2 text-slate-700">
                        {block.items.map((it, idx) => <li key={idx}>{it}</li>)}
                      </ul>
                    )}
                  </div>
                ))}
              </div>

              <div className="border-t border-slate-100 pt-6">
                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                  <Activity className="w-5 h-5 text-red-500" />
                  {lesson.check.question}
                </h3>
                
                <div className="grid gap-4">
                  {lesson.check.options.map((opt, idx) => (
                    <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                      <span className="text-slate-700 font-medium text-center sm:text-left">{opt.label.replace('___', '...')}</span>
                      <div className="flex gap-2">
                        <button 
                          onClick={() => handleAnswer('das', opt.correct, opt.reason)}
                          className="px-4 py-2 bg-white border border-slate-300 rounded-lg font-bold hover:bg-red-50 hover:border-red-300 transition-colors"
                        >
                          das
                        </button>
                        <button 
                          onClick={() => handleAnswer('dass', opt.correct, opt.reason)}
                          className="px-4 py-2 bg-white border border-slate-300 rounded-lg font-bold hover:bg-red-50 hover:border-red-300 transition-colors"
                        >
                          dass
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {feedback && (
                  <div className={`mt-6 p-4 rounded-xl border flex items-start gap-3 fade-in ${feedback.isCorrect ? 'bg-green-50 border-green-200 text-green-900' : 'bg-red-50 border-red-200 text-red-900'}`}>
                    {feedback.isCorrect ? <CheckCircle className="w-5 h-5 shrink-0" /> : <X className="w-5 h-5 shrink-0" />}
                    <div>
                      <p className="font-bold">{feedback.isCorrect ? "Richtig!" : "Nicht ganz."}</p>
                      {!feedback.isCorrect && <p className="text-sm mt-1">Hier passt <b>{feedback.correctVal}</b> besser.</p>}
                    </div>
                  </div>
                )}
              </div>

              <div className="mt-8 flex justify-between">
                <button 
                  onClick={() => { setStep(Math.max(0, step - 1)); setFeedback(null); }}
                  disabled={step === 0}
                  className="text-slate-400 hover:text-slate-600 font-medium disabled:opacity-30 flex items-center"
                >
                  <ArrowLeft className="w-4 h-4 mr-2" /> Zurück
                </button>
                <button 
                  onClick={nextStep}
                  className="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 transition-transform active:scale-95 flex items-center"
                >
                  {step === data.length - 1 ? "Zum Üben" : "Weiter"} <ArrowRight className="w-4 h-4 ml-2" />
                </button>
              </div>
            </div>
          );
        };

        /* -------------------------------------------------------------------------- */
        /* MODULE: PRACTICE                                                           */
        /* -------------------------------------------------------------------------- */
        const PracticeModule = ({ data, onRecord }) => {
          const [mode, setMode] = useState('mix');
          const [item, setItem] = useState(null);
          const [feedback, setFeedback] = useState(null);

          useEffect(() => {
            if (!item) startNewItem(mode);
          }, [mode]);

          const startNewItem = (newMode) => {
            setFeedback(null);
            if (newMode === 'mix') {
              const randomItem = data.items[Math.floor(Math.random() * data.items.length)];
              setItem({ ...randomItem, type: 'mix' });
            } else if (newMode === 'ersatz') {
              const randomRep = data.replacementItems[Math.floor(Math.random() * data.replacementItems.length)];
              setItem({ ...randomRep, type: 'ersatz' });
            } else if (newMode === 'detective') {
              const randomDet = data.detectiveTexts[Math.floor(Math.random() * data.detectiveTexts.length)];
              const parts = randomDet.storyParts.map(p => (typeof p === 'object' ? { ...p, current: p.val } : p));
              setItem({ ...randomDet, parts, type: 'detective' });
            } else if (newMode === 'dialog') {
              const randomDia = data.dialogSets[Math.floor(Math.random() * data.dialogSets.length)];
              const lines = randomDia.lines.map(l => ({ ...l, current: null }));
              setItem({ ...randomDia, lines, type: 'dialog' });
            }
          };

          const handleModeChange = (m) => {
            setMode(m);
            startNewItem(m);
          };

          const handleMixAnswer = (ans) => {
            const isCorrect = ans === item.correct;
            setFeedback({ isCorrect, text: isCorrect ? "Sehr gut!" : `Richtig ist: ${item.correct}`, explain: item.explain });
            onRecord(isCorrect);
          };

          const handleErsatzAnswer = (choice) => {
            const isCorrect = item.correct === 'dass'
              ? choice === 'keines passt'
              : (item.ok || []).includes(choice);

            const correctText = item.correct === 'dass'
              ? 'keines passt'
              : (item.ok && item.ok.length ? item.ok.join(' / ') : 'dieses');

            setFeedback({
              isCorrect,
              text: isCorrect ? "Sehr gut!" : `Richtig ist: ${correctText}`,
              explain: item.explain
            });
            onRecord(isCorrect);
          };


          const toggleDetectiveWord = (partId) => {
            setItem(prev => ({
              ...prev,
              parts: prev.parts.map(p => {
                if (typeof p !== 'object' || p.id !== partId) return p;
                return { ...p, current: p.current === 'das' ? 'dass' : 'das' };
              })
            }));
          };

          const checkDetective = () => {
            let correctCount = 0;
            let total = 0;
            item.parts.forEach(p => {
              if (typeof p === 'object') {
                total++;
                if (p.current.toLowerCase() === p.correct.toLowerCase()) correctCount++;
              }
            });
            const allCorrect = correctCount === total;
            setFeedback({ 
              isCorrect: allCorrect, 
              text: allCorrect ? "Perfekt gelöst!" : `Du hast ${correctCount} von ${total} Wörtern richtig.`,
              explain: "Tipp: Nebensätze brauchen 'dass', Pronomen 'das'."
            });
            onRecord(correctCount > total * 0.8);
          };

          const setDialogAnswer = (lineId, val) => {
            setItem(prev => ({
              ...prev,
              lines: prev.lines.map(l => l.id === lineId ? { ...l, current: val } : l)
            }));
          };

          const checkDialog = () => {
            let correctCount = 0;
            let total = item.lines.length;
            item.lines.forEach(l => {
              if (l.current === l.correct) correctCount++;
            });
            const allCorrect = correctCount === total;
            setFeedback({
              isCorrect: allCorrect,
              text: allCorrect ? "Dialog komplett richtig!" : `${correctCount} von ${total} Zeilen stimmen.`,
              explain: "Versuche es bei den falschen noch einmal."
            });
            onRecord(allCorrect);
          };

          return (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="bg-slate-50 border-b border-slate-200 p-2 flex gap-2 overflow-x-auto">
                {['mix', 'ersatz', 'detective', 'dialog'].map(m => (
                  <button
                    key={m}
                    onClick={() => handleModeChange(m)}
                    className={`px-4 py-2 rounded-lg text-sm font-bold capitalize transition-colors ${
                      mode === m ? 'bg-white text-red-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'
                    }`}
                  >
                    {m === 'mix' ? 'Lückentext' : m === 'ersatz' ? 'Ersatzprobe' : m}
                  </button>
                ))}
              </div>

              <div className="p-8">
                {!item ? <div className="p-8 text-center text-slate-400">Lade Aufgabe...</div> : (
                  <>
                    {mode === 'mix' && (
                      <div className="max-w-2xl mx-auto fade-in">
                        <div className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-4">
                          <span>Level {item.level}</span>
                          <span>{item.reason === 'clause' ? 'Nebensatz' : 'Ersatzprobe'}</span>
                        </div>
                        <div className="text-xl md:text-2xl leading-relaxed text-slate-800 mb-8 font-medium">
                          {renderTextWithBlank(item.text, feedback ? (feedback.isCorrect ? item.correct : '...') : null, feedback ? (feedback.isCorrect ? 'correct' : 'wrong') : 'neutral')}
                        </div>
                        {!feedback ? (
                          <div className="grid grid-cols-2 gap-4">
                            <button onClick={() => handleMixAnswer('das')} className="h-14 bg-white border-2 border-slate-200 hover:border-red-400 rounded-xl font-bold text-lg hover:bg-red-50 transition-all">das</button>
                            <button onClick={() => handleMixAnswer('dass')} className="h-14 bg-white border-2 border-slate-200 hover:border-red-400 rounded-xl font-bold text-lg hover:bg-red-50 transition-all">dass</button>
                          </div>
                        ) : (
                          <div className={`p-6 rounded-xl border ${feedback.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                            <h3 className={`font-bold ${feedback.isCorrect ? 'text-green-900' : 'text-red-900'}`}>{feedback.text}</h3>
                            <p className="text-slate-700 mt-2">{feedback.explain}</p>
                            <button onClick={() => startNewItem('mix')} className="mt-4 bg-slate-900 text-white px-6 py-2 rounded-lg font-bold text-sm">Nächste Frage</button>
                          </div>
                        )}
                      </div>
                    )}

                    {mode === 'ersatz' && (
                      <div className="max-w-2xl mx-auto fade-in">
                        <div className="flex justify-between text-xs font-bold text-slate-400 uppercase mb-4">
                          <span>Ersatzprobe</span>
                          <span>dieses / welches / jenes</span>
                        </div>

                        <div className="text-xl md:text-2xl leading-relaxed text-slate-800 mb-8 font-medium">
                          {renderTextWithBlank(item.text, '___', feedback ? (feedback.isCorrect ? 'correct' : 'wrong') : 'neutral')}
                        </div>

                        {!feedback ? (
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            {['dieses', 'welches', 'jenes', 'keines passt'].map(ch => (
                              <button
                                key={ch}
                                onClick={() => handleErsatzAnswer(ch)}
                                className="bg-white border border-slate-200 rounded-xl px-4 py-3 font-bold text-base hover:bg-red-50 transition-all"
                              >
                                {ch}
                              </button>
                            ))}
                          </div>
                        ) : (
                          <div className={`p-6 rounded-xl border ${feedback.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                            <h3 className={`font-bold ${feedback.isCorrect ? 'text-green-900' : 'text-red-900'}`}>{feedback.text}</h3>
                            <p className="text-slate-700 mt-2">{feedback.explain}</p>
                            <div className="mt-4 flex gap-2 flex-wrap">
                              <div className="text-xs font-bold uppercase text-slate-500 tracking-wide">
                                Ergebnis: {item.correct === 'dass' ? 'dass' : 'das'}
                              </div>
                            </div>
                            <button onClick={() => startNewItem('ersatz')} className="mt-4 bg-slate-900 text-white px-6 py-2 rounded-lg font-bold text-sm">Nächste Frage</button>
                          </div>
                        )}
                      </div>
                    )}


                    {mode === 'detective' && (
                      <div className="max-w-3xl mx-auto fade-in">
                        <div className="flex justify-between items-center mb-4">
                          <h3 className="font-bold text-lg flex items-center gap-2"><Search className="w-5 h-5 text-red-500"/> {item.title}</h3>
                          <button onClick={() => startNewItem('detective')} className="text-xs font-bold text-slate-400 hover:text-slate-600">Neuer Text</button>
                        </div>
                        <div className="bg-amber-50 border border-amber-100 p-6 rounded-xl font-serif text-lg leading-loose text-slate-800 shadow-inner mb-6">
                          {item.parts.map((p, i) => {
                            if (typeof p === 'string') return <span key={i}>{p}</span>;
                            return (
                              <button
                                key={i}
                                onClick={() => toggleDetectiveWord(p.id)}
                                className={`mx-1 px-2 py-0.5 rounded font-bold transition-all border-b-2 ${
                                  feedback 
                                    ? (p.current.toLowerCase() === p.correct.toLowerCase() ? 'bg-green-200 border-green-400 text-green-900' : 'bg-red-200 border-red-400 text-red-900')
                                    : (p.current !== p.val ? 'bg-red-100 border-red-400 text-red-900' : 'bg-white border-slate-300')
                                }`}
                              >
                                {p.current}
                              </button>
                            );
                          })}
                        </div>
                        {!feedback && (
                          <div className="flex justify-between items-center">
                            <p className="text-slate-500 text-sm italic">{item.hint}</p>
                            <button onClick={checkDetective} className="bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-sm hover:bg-red-700 transition-transform active:scale-95">Prüfen</button>
                          </div>
                        )}
                        {feedback && (
                          <div className={`p-4 rounded-xl border flex justify-between items-center ${feedback.isCorrect ? 'bg-green-50 border-green-200' : 'bg-white border-slate-200'}`}>
                            <div>
                              <h4 className="font-bold">{feedback.text}</h4>
                              <p className="text-sm text-slate-600">{feedback.explain}</p>
                            </div>
                            <button onClick={() => startNewItem('detective')} className="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold text-sm">Weiter</button>
                          </div>
                        )}
                      </div>
                    )}

                    {mode === 'dialog' && (
                      <div className="max-w-2xl mx-auto fade-in">
                        <div className="flex justify-between items-center mb-6">
                          <h3 className="font-bold text-lg flex items-center gap-2"><MessageCircle className="w-5 h-5 text-red-500"/> {item.title}</h3>
                          <button onClick={() => startNewItem('dialog')} className="text-xs font-bold text-slate-400 hover:text-slate-600">Neuer Dialog</button>
                        </div>
                        <div className="space-y-4 mb-8">
                          {item.lines.map((line) => (
                            <div key={line.id} className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                              <div className="text-lg text-slate-800">
                                {renderTextWithBlank(line.text, line.current, feedback ? (line.current === line.correct ? 'correct' : 'wrong') : null)}
                              </div>
                              {!feedback && (
                                <div className="flex gap-2 mt-3 justify-end">
                                  <button onClick={() => setDialogAnswer(line.id, 'das')} className={`px-3 py-1 text-sm rounded-lg font-bold border transition-colors ${line.current === 'das' ? 'bg-red-600 text-white border-red-600' : 'bg-white border-slate-300 text-slate-600'}`}>das</button>
                                  <button onClick={() => setDialogAnswer(line.id, 'dass')} className={`px-3 py-1 text-sm rounded-lg font-bold border transition-colors ${line.current === 'dass' ? 'bg-red-600 text-white border-red-600' : 'bg-white border-slate-300 text-slate-600'}`}>dass</button>
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                        {!feedback ? (
                           <div className="flex justify-end">
                             <button onClick={checkDialog} className="bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-sm hover:bg-red-700 transition-transform active:scale-95">Dialog prüfen</button>
                           </div>
                        ) : (
                          <div className="flex justify-between items-center p-4 bg-slate-100 rounded-xl">
                             <div>
                               <h4 className="font-bold">{feedback.text}</h4>
                               <p className="text-sm text-slate-600">{feedback.explain}</p>
                             </div>
                             <button onClick={() => startNewItem('dialog')} className="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold text-sm">Nächster</button>
                          </div>
                        )}
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          );
        };

        /* -------------------------------------------------------------------------- */
        /* MODULE: TEST                                                               */
        /* -------------------------------------------------------------------------- */
        const TestModule = ({ items, onRecord }) => {
          const [active, setActive] = useState(false);
          const [currentIndex, setCurrentIndex] = useState(0);
          const [testSet, setTestSet] = useState([]);
          const [answers, setAnswers] = useState({});
          const [finished, setFinished] = useState(false);
          const [startTime, setStartTime] = useState(null);
          const [duration, setDuration] = useState(0);

          useEffect(() => {
            let interval;
            if (active && !finished) {
              interval = setInterval(() => {
                setDuration(Math.floor((Date.now() - startTime) / 1000));
              }, 1000);
            }
            return () => clearInterval(interval);
          }, [active, finished, startTime]);

          const startTest = () => {
            const shuffled = [...items].sort(() => 0.5 - Math.random()).slice(0, 10);
            setTestSet(shuffled);
            setActive(true);
            setFinished(false);
            setCurrentIndex(0);
            setAnswers({});
            setStartTime(Date.now());
            setDuration(0);
          };

          const handleAnswer = (val) => {
            setAnswers(prev => ({ ...prev, [testSet[currentIndex].id]: val }));
            if (currentIndex < testSet.length - 1) {
              setCurrentIndex(currentIndex + 1);
            } else {
              setFinished(true);
            }
          };

          if (!active) {
            return (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center fade-in">
                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6">
                  <Clock className="w-8 h-8" />
                </div>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">Selbsttest</h2>
                <p className="text-slate-500 mb-8 max-w-md mx-auto">10 zufällige Fragen. Die Zeit läuft mit. Am Ende bekommst du eine Auswertung.</p>
                <button onClick={startTest} className="bg-red-600 text-white px-8 py-3 rounded-xl font-bold text-lg shadow-lg hover:bg-red-700 transition-transform active:scale-95">Test starten</button>
              </div>
            );
          }

          if (finished) {
            const score = testSet.filter(i => answers[i.id] === i.correct).length;
            const percentage = Math.round((score / testSet.length) * 100);

            return (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 fade-in">
                <div className="text-center mb-8">
                  <h2 className="text-2xl font-bold text-slate-800">Auswertung</h2>
                  <p className="text-slate-500">Zeit: {duration} Sekunden</p>
                </div>
                <div className="flex justify-center mb-8">
                  <div className="relative w-32 h-32 flex items-center justify-center">
                    <svg className="w-full h-full transform -rotate-90">
                      <circle cx="64" cy="64" r="56" stroke="#e2e8f0" strokeWidth="8" fill="transparent" />
                      <circle cx="64" cy="64" r="56" stroke={percentage > 70 ? "#22c55e" : "#f59e0b"} strokeWidth="8" fill="transparent" strokeDasharray={351} strokeDashoffset={351 - (351 * percentage) / 100} className="transition-all duration-1000" />
                    </svg>
                    <span className="absolute text-2xl font-bold text-slate-700">{percentage}%</span>
                  </div>
                </div>
                <div className="space-y-4 max-w-2xl mx-auto mb-8">
                  {testSet.map((item, idx) => {
                    const ans = answers[item.id];
                    const isOk = ans === item.correct;
                    return (
                      <div key={item.id} className={`p-4 rounded-lg border flex justify-between items-center ${isOk ? 'bg-slate-50 border-slate-200' : 'bg-red-50 border-red-200'}`}>
                        <div>
                          <span className="text-xs font-bold text-slate-400 mr-2">#{idx+1}</span>
                          <span className="font-medium">{item.text.replace('___', `[${item.correct}]`)}</span>
                        </div>
                        {isOk ? <Check className="w-5 h-5 text-green-500" /> : <div className="text-red-600 font-bold text-sm">Deine Antwort: {ans}</div>}
                      </div>
                    );
                  })}
                </div>
                <div className="text-center">
                  <button onClick={() => setActive(false)} className="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-800">Schließen</button>
                </div>
              </div>
            );
          }

          const currentItem = testSet[currentIndex];

          return (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 fade-in">
              <div className="flex justify-between items-center mb-8">
                <span className="font-bold text-slate-400">Frage {currentIndex + 1} / {testSet.length}</span>
                <span className="font-mono bg-slate-100 px-3 py-1 rounded text-slate-600">{duration}s</span>
              </div>
              <div className="text-2xl font-medium text-slate-800 mb-12 text-center leading-relaxed">
                {renderTextWithBlank(currentItem.text, null, 'neutral')}
              </div>
              <div className="grid grid-cols-2 gap-6 max-w-md mx-auto">
                <button onClick={() => handleAnswer('das')} className="h-16 bg-white border-2 border-slate-200 hover:border-red-500 hover:bg-red-50 rounded-2xl font-bold text-xl transition-all shadow-sm">das</button>
                <button onClick={() => handleAnswer('dass')} className="h-16 bg-white border-2 border-slate-200 hover:border-red-500 hover:bg-red-50 rounded-2xl font-bold text-xl transition-all shadow-sm">dass</button>
              </div>
            </div>
          );
        };

        /* -------------------------------------------------------------------------- */
        /* MODULE: HELP                                                               */
        /* -------------------------------------------------------------------------- */
        const HelpModule = () => (
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 fade-in">
            <h2 className="text-2xl font-bold text-slate-800 mb-6">Schnelle Hilfe</h2>
            <div className="grid md:grid-cols-2 gap-6">
              <div className="bg-red-50 p-6 rounded-xl border border-red-100">
                <h3 className="font-bold text-red-900 mb-2">1) Die Ersatzprobe</h3>
                <p className="text-red-800 text-sm mb-2">Kannst du <b>dieses</b>, <b>jenes</b> oder <b>welches</b> einsetzen?</p>
                <div className="bg-white p-3 rounded-lg border border-red-200 text-sm">"Ich finde das (dieses) gut." <Check className="inline w-3 h-3 text-green-500 ml-1"/></div>
              </div>
              <div className="bg-amber-50 p-6 rounded-xl border border-amber-100">
                <h3 className="font-bold text-amber-900 mb-2">2) Der Nebensatz-Check</h3>
                <p className="text-amber-800 text-sm mb-2">Folgt ein ganzer Satz? (Oft steht das Verb am Ende)</p>
                <div className="bg-white p-3 rounded-lg border border-amber-200 text-sm">"Ich glaube, dass du kommst."</div>
              </div>
              <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 md:col-span-2">
                <h3 className="font-bold text-slate-800 mb-2">Mini-Training (5 Sekunden)</h3>
                <p className="text-slate-600 text-sm">Sage laut: <i>"Ich weiß, ___ du da bist."</i> <br/>Klingt "dieses du da bist"? Nein → Also <b>dass</b>.</p>
              </div>
            </div>
          </div>
        );

        /* -------------------------------------------------------------------------- */
        /* MAIN APP                                                                   */
        /* -------------------------------------------------------------------------- */
        const DassDasApp = () => {
          const [activeTab, setActiveTab] = useState('learn');
          const [stats, setStats] = useState({ correct: 0, total: 0, streak: 0, bestStreak: 0 });

          const recordResult = (isCorrect) => {
            setStats(prev => {
              const newStreak = isCorrect ? prev.streak + 1 : 0;
              return {
                correct: prev.correct + (isCorrect ? 1 : 0),
                total: prev.total + 1,
                streak: newStreak,
                bestStreak: Math.max(prev.bestStreak, newStreak)
              };
            });
          };

          const resetStats = () => setStats({ correct: 0, total: 0, streak: 0, bestStreak: 0 });

          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8 flex flex-col items-center">
              <header className="w-full max-w-4xl mb-6 flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div className="flex items-center gap-4 mb-4 md:mb-0">
                  <div className="bg-red-600 text-white font-bold px-3 py-1 rounded text-sm tracking-wide">DEUTSCH</div>
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Das oder Dass?</h1>
                    <p className="text-slate-500 text-sm">Lernen • Üben • Testen</p>
                  </div>
                </div>
                <div className="flex gap-3 text-sm">
                  <div className="px-4 py-2 bg-slate-50 rounded-lg border border-slate-100 flex items-center gap-2">
                    <Trophy className="w-4 h-4 text-yellow-500" />
                    <span className="font-semibold">{stats.streak}</span> <span className="text-slate-400">Serie</span>
                  </div>
                  <div className="px-4 py-2 bg-slate-50 rounded-lg border border-slate-100 flex items-center gap-2">
                    <Activity className="w-4 h-4 text-green-500" />
                    <span className="font-semibold">{stats.total > 0 ? Math.round((stats.correct/stats.total)*100) : 0}%</span> <span className="text-slate-400">Richtig</span>
                  </div>
                </div>
              </header>

              <div className="w-full max-w-4xl flex mb-6 bg-white p-1 rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
                {[
                  { id: 'learn', icon: BookOpen, label: 'Lernen' },
                  { id: 'practice', icon: PenTool, label: 'Üben' },
                  { id: 'test', icon: CheckCircle, label: 'Test' },
                  { id: 'help', icon: HelpCircle, label: 'Hilfe' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex-1 flex items-center justify-center py-3 px-4 rounded-lg text-sm font-bold transition-all ${
                      activeTab === tab.id
                        ? 'bg-red-50 text-red-700 shadow-sm'
                        : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    <tab.icon className="w-4 h-4 mr-2" />
                    {tab.label}
                  </button>
                ))}
              </div>

              <main className="w-full max-w-4xl">
                {activeTab === 'learn' && <LearnModule data={DATA.lessons} onComplete={() => setActiveTab('practice')} onRecord={recordResult} />}
                {activeTab === 'practice' && <PracticeModule data={DATA} onRecord={recordResult} />}
                {activeTab === 'test' && <TestModule items={DATA.items} onRecord={recordResult} />}
                {activeTab === 'help' && <HelpModule />}
              </main>

              <footer className="mt-12 text-center text-slate-400 text-sm pb-8">
                <button onClick={() => { if(window.confirm("Statistik zurücksetzen?")) resetStats(); }} className="hover:text-slate-600 transition-colors">Statistik zurücksetzen</button>
                <p className="mt-2">HoS Learning • Einfach. Ruhig. Effektiv.</p>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DassDasApp />);
    </script>
</body>
</html>
