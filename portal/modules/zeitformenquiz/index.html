<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitformen-Quiz • HoS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/app-layout.css">
  <style>
    .quiz { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 32px; }
    .quiz-label { color: var(--hos-muted); font-weight: 700; }
    .question { margin: 0; font-size: clamp(1.6rem, 3vw, 2.3rem); font-weight: 800; line-height: 1.25; }
    .answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .option {
      text-align: left;
      border-radius: 14px;
      border: 2px solid var(--hos-line);
      padding: 14px 16px;
      background: #fff;
      color: var(--hos-ink);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .option:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--subject-line); background: var(--subject-soft); }
    .option:disabled { cursor: default; }
    .option.ok { border-color: #16a34a; background: var(--hos-good-soft); color: var(--hos-good); }
    .option.no { border-color: #dc2626; background: var(--hos-bad-soft); color: var(--hos-bad); }
    .result { text-align: center; display: grid; gap: 10px; justify-items: center; }
    .result .big { font-size: 3rem; font-weight: 900; color: var(--subject); line-height: 1; }
    .result p { margin: 0; font-size: 1.15rem; }
    @media (max-width: 700px) { .answers { grid-template-columns: 1fr 1fr; } .quiz { padding: 16px; } }
  </style>
</head>
<body class="hos-app subject-deutsch">
  <header class="app-header">
    <div class="brand-row">
      <img src="/chatisthisreal.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
      <div class="brand-title">
        <div class="badge-main is-deutsch">Deutsch</div>
        <h1>Zeitformen-Quiz</h1>
      </div>
    </div>
    <div class="header-actions">
      <a href="/index.html" class="header-link">Startseite</a>
    </div>
  </header>

  <main class="hos-main">
    <div class="hos-topbar">
      <span class="hos-label">Frage <span id="qNo">1</span> von <span id="qTotal">6</span></span>
      <div class="hos-progress" style="width: 260px" aria-label="Fortschritt"><span id="bar"></span></div>
      <span class="hos-spacer"></span>
      <span class="hos-pill">Punkte: <b id="score">0</b></span>
    </div>

    <div class="hos-stage">
      <section class="hos-panel quiz" id="quiz">
        <div class="quiz-label">Welche Zeitform ist das?</div>
        <p class="question" id="questionText"></p>
        <div class="answers" id="answers"></div>
      </section>
      <section class="hos-panel quiz result" id="resultBox" hidden></section>
    </div>

    <div class="hos-bottombar">
      <button class="hos-btn soft" id="restartBtn" type="button">↺ Neustart</button>
      <div class="hos-feedback" id="hint" aria-live="polite">Tipp: Achte auf Hilfsverben wie haben, sein und werden.</div>
      <button class="hos-btn soft" id="skipBtn" type="button">Überspringen</button>
      <button class="hos-btn primary" id="nextBtn" type="button">Weiter →</button>
    </div>
  </main>

  <script src="/js/hos-results.js"></script>
  <script>
    const R = HoSResults.init({ app: 'zeitformenquiz', title: 'Zeitformen-Quiz' });
    const questions = [
      { text: "Ich gehe morgen spazieren.", answer: "Präsens", tip: "Mit Zeitangabe kann das Präsens auch Zukunft meinen." },
      { text: "Ich ging nach Hause.", answer: "Präteritum", tip: "Das Präteritum ist die Erzählzeit, oft in Geschichten." },
      { text: "Ich habe gegessen.", answer: "Perfekt", tip: "Perfekt: haben/sein + Partizip II." },
      { text: "Ich hatte gegessen, bevor ich ging.", answer: "Plusquamperfekt", tip: "Plusquamperfekt: hatte/war + Partizip II (Vorvergangenheit)." },
      { text: "Ich werde lernen.", answer: "Futur I", tip: "Futur I: werden + Infinitiv." },
      { text: "Ich werde gelernt haben.", answer: "Futur II", tip: "Futur II: werden + Partizip II + haben/sein." }
    ];
    const options = ["Präsens", "Präteritum", "Perfekt", "Plusquamperfekt", "Futur I", "Futur II"];
    const GENERAL_TIP = "Tipp: Achte auf Hilfsverben wie haben, sein und werden.";

    let i = 0;
    let score = 0;
    let locked = false;
    let wrongList = [];

    const $ = (id) => document.getElementById(id);
    const answersEl = $("answers");
    $("qTotal").textContent = String(questions.length);

    function shuffle(arr) {
      const a = arr.slice();
      for (let j = a.length - 1; j > 0; j--) {
        const k = Math.floor(Math.random() * (j + 1));
        [a[j], a[k]] = [a[k], a[j]];
      }
      return a;
    }

    function setFeedback(text, kind) {
      const el = $("hint");
      el.className = "hos-feedback" + (kind ? " " + kind : "");
      el.textContent = text;
    }

    function render() {
      locked = false;
      $("quiz").hidden = false;
      $("resultBox").hidden = true;
      $("skipBtn").disabled = false;
      $("nextBtn").disabled = false;
      $("nextBtn").textContent = (i === questions.length - 1) ? "Auswertung →" : "Weiter →";
      $("qNo").textContent = String(i + 1);
      $("questionText").textContent = questions[i].text;
      setFeedback(GENERAL_TIP, "");

      answersEl.innerHTML = "";
      shuffle(options).forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = opt;
        btn.addEventListener("click", () => choose(opt, btn));
        answersEl.appendChild(btn);
      });
      $("bar").style.width = Math.round(i / questions.length * 100) + "%";
    }

    function choose(opt, btn) {
      if (locked) return;
      locked = true;
      const q = questions[i];
      const buttons = Array.from(answersEl.querySelectorAll("button"));
      buttons.forEach(b => b.disabled = true);
      if (opt === q.answer) {
        score++;
        $("score").textContent = String(score);
        btn.classList.add("ok");
        setFeedback("Richtig! " + q.tip, "good");
        R.answer(true, q.answer);
      } else {
        R.answer(false, q.answer);
        wrongList.push(q.text + ' → ' + q.answer + ' (du: ' + opt + ')');
        btn.classList.add("no");
        const correctBtn = buttons.find(b => b.textContent === q.answer);
        if (correctBtn) correctBtn.classList.add("ok");
        setFeedback("Leider falsch. Richtig ist: " + q.answer + ". " + q.tip, "bad");
      }
      R.save('stand', { i, score, wrongList, answered: true });
    }

    function finish() {
      $("bar").style.width = "100%";
      const max = questions.length;
      const pct = Math.round(score / max * 100);
      R.round({ score, total: max, label: 'Quiz', wrong: wrongList });
      R.save('stand', null);
      let mood;
      if (pct >= 90) mood = "Zeitformen-Profi!";
      else if (pct >= 70) mood = "Richtig stark!";
      else if (pct >= 50) mood = "Guter Start!";
      else mood = "Übung macht den Meister.";
      $("quiz").hidden = true;
      const box = $("resultBox");
      box.hidden = false;
      box.innerHTML = '<div class="quiz-label">Dein Ergebnis</div><div class="big">' + score + " / " + max + "</div><p><b>" + mood + "</b></p>";
      setFeedback("Starte noch einmal. Beim zweiten Durchgang sitzt es oft schon viel besser.", pct >= 70 ? "good" : "warn");
      $("skipBtn").disabled = true;
      $("nextBtn").disabled = true;
    }

    function advance() {
      if (i < questions.length - 1) { i++; R.save('stand', { i, score, wrongList }); render(); } else { finish(); }
    }

    $("nextBtn").addEventListener("click", advance);
    $("skipBtn").addEventListener("click", advance);
    $("restartBtn").addEventListener("click", () => {
      i = 0; score = 0; wrongList = []; R.save('stand', null); $("score").textContent = "0"; render();
    });

    // Zwischenstand wiederherstellen
    const stand = R.load('stand');
    if (stand && stand.i < questions.length) {
      i = stand.answered ? Math.min(stand.i + 1, questions.length - 1) : stand.i;
      score = stand.score || 0; wrongList = stand.wrongList || [];
      $("score").textContent = String(score);
      if (stand.answered && stand.i === questions.length - 1) { render(); finish(); } else render();
    } else render();
  </script>
</body>
</html>
